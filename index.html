<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Minecraft - Save & Load</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            margin-top: -5px;
            margin-left: -5px;
            pointer-events: none;
            color: white;
            font-size: 20px;
            line-height: 10px;
            text-align: center;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
        }
        button {
            margin-top: 5px;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #008CBA;
            color: white;
        }
        button:hover { background: #005f73; }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair">+</div>
    <div id="ui">
        <b>操作方法:</b><br>
        ・画面クリック：視点操作開始（Escで解除）<br>
        ・WASD / 矢印キー：移動<br>
        ・左クリック：ブロック破壊<br>
        ・右クリック：ブロック設置<br>
        <button id="save-btn">セーブ (Save)</button>
        <button id="load-btn">ロード (Load)</button>
        <button id="reset-btn" style="background:#f44336;">リセット</button>
    </div>

    <script>
        // 1. 基本セットアップ (Scene, Camera, Renderer)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // 空色

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // ライト
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // ブロック・マテリアル（草ブロック風）
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const material = new THREE.MeshLambertMaterial({ color: 0x55aa55 }); // 緑色

        // ワールドデータを管理する配列
        let blocks = [];

        // 2. 初期ワールド生成（平原）
        function createInitialWorld() {
            clearWorld();
            for (let x = -5; x <= 5; x++) {
                for (let z = -5; z <= 5; z++) {
                    addBlock(x, 0, z);
                }
            }
        }

        function addBlock(x, y, z) {
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(x, y, z);
            scene.add(cube);
            blocks.push(cube);
        }

        function clearWorld() {
            blocks.forEach(b => scene.remove(b));
            blocks = [];
        }

        // 3. セーブ＆ロード機能 (localStorage)
        document.getElementById('save-btn').addEventListener('click', () => {
            const worldData = blocks.map(b => ({
                x: b.position.x,
                y: b.position.y,
                z: b.position.z
            }));
            localStorage.setItem('web_minecraft_save', JSON.stringify(worldData));
            alert('ワールドデータをセーブしました！');
        });

        document.getElementById('load-btn').addEventListener('click', () => {
            const savedData = localStorage.getItem('web_minecraft_save');
            if (savedData) {
                clearWorld();
                const worldData = JSON.parse(savedData);
                worldData.forEach(pos => addBlock(pos.x, pos.y, pos.z));
                alert('ワールドデータをロードしました！');
            } else {
                alert('セーブデータが見つかりません。');
            }
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            if (confirm('ワールドを初期化しますか？')) {
                createInitialWorld();
            }
        });

        // 4. プレイヤー移動＆視点制御 (Pointer Lock API)
        camera.position.set(0, 3, 8);

        let isLocked = false;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        document.body.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === document.body;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
        });

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        // 5. ブロックの破壊と設置 (Raycaster)
        const raycaster = new THREE.Raycaster();
        
        window.addEventListener('mousedown', (e) => {
            if (!isLocked) return;

            // 画面中央（レイキャストの発射位置）
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const intersect = intersects[0];

                if (e.button === 0) {
                    // 左クリック：ブロック破壊
                    scene.remove(intersect.object);
                    blocks = blocks.filter(b => b !== intersect.object);
                } else if (e.button === 2) {
                    // 右クリック：ブロック設置
                    const normal = intersect.face.normal;
                    const newPos = intersect.object.position.clone().add(normal);
                    addBlock(newPos.x, newPos.y, newPos.z);
                }
            }
        });

        // 右クリックメニューの無効化
        window.addEventListener('contextmenu', e => e.preventDefault());

        // 初期表示
        createInitialWorld();

        // 6. アニメーションループ
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (isLocked) {
                // 移動計算
                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) camera.translateZ(-direction.z * 10 * delta);
                if (moveLeft || moveRight) camera.translateX(direction.x * 10 * delta);
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        animate();

        // リサイズ対応
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
