<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CSO Macau - Mobile & PC FPS</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; touch-action: none; }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 10px; height: 10px; border: 2px solid #00ffcc;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
      border-radius: 50%;
    }
    #ui {
      position: absolute; bottom: 10px; left: 10px;
      color: #fff; font-size: 14px; text-shadow: 2px 2px 5px #000; z-index: 10;
      background: rgba(15, 23, 42, 0.85); padding: 10px; border-radius: 8px;
    }
    #hp-bar-container {
      width: 140px; height: 12px; background: #1e293b; border: 1px solid #38bdf8; margin-top: 4px; border-radius: 6px; overflow: hidden;
    }
    #hp-bar { width: 100%; height: 100%; background: #ef4444; }
    
    #mission-tracker {
      position: absolute; top: 10px; right: 10px;
      background: rgba(15, 23, 42, 0.9); color: #f59e0b;
      padding: 10px 14px; border-radius: 8px; z-index: 10;
      border: 1px solid #f59e0b; font-size: 12px; font-weight: bold;
    }

    /* 手機按鈕 */
    #mobile-controls {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 12; pointer-events: none;
    }
    #joystick-zone {
      position: absolute; bottom: 20px; left: 20px; width: 120px; height: 120px; pointer-events: auto;
    }
    #shoot-btn {
      position: absolute; bottom: 30px; right: 30px; width: 70px; height: 70px;
      background: rgba(239, 68, 68, 0.8); border: 2px solid #fff; border-radius: 50%;
      color: white; font-weight: bold; font-size: 16px; pointer-events: auto;
      display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    #switch-btn {
      position: absolute; bottom: 110px; right: 35px; width: 50px; height: 50px;
      background: rgba(56, 189, 248, 0.8); border: 1px solid #fff; border-radius: 50%;
      color: white; font-size: 12px; pointer-events: auto;
      display: flex; justify-content: center; align-items: center;
    }

    #menu-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95); color: white;
      padding: 20px; border-radius: 12px; z-index: 20; width: 85%; max-width: 320px;
      border: 1px solid #f59e0b; text-align: center;
    }
    #menu-panel button {
      padding: 12px; font-size: 16px; margin-top: 10px; cursor: pointer;
      background: #d97706; color: white; border: none; border-radius: 6px; font-weight: bold; width: 100%;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
  <!-- 虛擬搖桿套件 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>

  <div id="crosshair"></div>

  <!-- 任務追蹤 -->
  <div id="mission-tracker">
    🎯 任務：【澳門撤離行動】<br>
    📦 物資箱：<span id="supply-count" style="color:#fff;">0 / 3</span><br>
    🚁 撤離：<span id="evac-status" style="color:#ef4444;">未解鎖</span>
  </div>

  <!-- 手機介面 -->
  <div id="mobile-controls">
    <div id="joystick-zone"></div>
    <div id="shoot-btn">開槍</div>
    <div id="switch-btn">換槍</div>
  </div>

  <!-- 選單面板 -->
  <div id="menu-panel">
    <h3 style="margin: 0; color: #f59e0b; font-size: 20px;">🇲🇴 澳門生存戰：大三巴突圍</h3>
    <p style="font-size: 12px; color: #cbd5e1; margin-top: 6px;">支援手機觸控 & 電腦 PC 雙平台</p>
    <button id="start-btn">開始遊戲</button>
  </div>

  <div id="ui">
    <div>HP: <div id="hp-bar-container"><div id="hp-bar"></div></div></div>
    <div style="margin-top:4px;">擊殺: <span id="kills" style="color:#f59e0b;">0</span> | <span id="weapon-name">AK-47</span></div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let isMobile = false;
    let killCount = 0, playerHP = 100;
    let collectedSupplies = 0, totalSupplies = 3, isEvacReady = false;

    const collidableObjects = [], zombies = [], supplyBoxes = [];
    let evacZone = null, gunMesh;

    // 移動變數
    let moveVector = { x: 0, y: 0 };
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let touchStartX = 0, touchStartY = 0;
    let lon = 0, lat = 0;

    const weapons = {
      rifle: { name: 'AK-47', color: 0x8B4513, length: 0.9, damage: 40 },
      pistol: { name: 'Glock 18', color: 0x222222, length: 0.4, damage: 25 }
    };
    let currentWeaponKey = 'rifle';

    // 檢測是否為手機
    if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
      isMobile = true;
    }

    init3D();
    if (isMobile) initMobileUI();
    animate();

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0f19);
      scene.fog = new THREE.FogExp2(0x0b0f19, 0.012);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

      const ambientLight = new THREE.AmbientLight(0xddeeff, 0.6);
      scene.add(ambientLight);
      const moonLight = new THREE.DirectionalLight(0xfbbf24, 0.8);
      moonLight.position.set(50, 80, 30);
      scene.add(moonLight);

      // 地板 & 地標
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(250, 250), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      createRuinsOfStPaul();
      createGrandLisboa();

      // 第一人稱相機與電腦控制
      camera.position.set(0, 1.6, 10);
      if (!isMobile) {
        controls = new THREE.PointerLockControls(camera, document.body);
        scene.add(controls.getObject());
      }

      createGunMesh();

      document.getElementById('start-btn').addEventListener('click', startGame);

      // 電腦事件
      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      document.addEventListener('mousedown', (e) => { if(!isMobile && controls && controls.isLocked) onShoot(); });

      // 手機滑動轉視角事件
      if (isMobile) {
        document.addEventListener('touchstart', (e) => {
          if (e.touches[0].clientX > window.innerWidth / 2) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
          }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
          for (let touch of e.touches) {
            if (touch.clientX > window.innerWidth / 2) {
              const deltaX = touch.clientX - touchStartX;
              const deltaY = touch.clientY - touchStartY;
              lon -= deltaX * 0.25;
              lat -= deltaY * 0.25;
              lat = Math.max(-85, Math.min(85, lat));
              touchStartX = touch.clientX;
              touchStartY = touch.clientY;
            }
          }
        }, { passive: false });
      }

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
    }

    // 手機介面與搖桿初始化
    function initMobileUI() {
      document.getElementById('mobile-controls').style.display = 'block';

      // 虛擬搖桿
      const manager = nipplejs.create({
        zone: document.getElementById('joystick-zone'),
        mode: 'static',
        position: { left: '60px', bottom: '60px' },
        color: 'white'
      });

      manager.on('move', (evt, data) => {
        if (data.vector) {
          moveVector.x = data.vector.x;
          moveVector.y = data.vector.y;
        }
      });

      manager.on('end', () => {
        moveVector.x = 0;
        moveVector.y = 0;
      });

      // 手機按鈕事件
      document.getElementById('shoot-btn').addEventListener('touchstart', (e) => { e.preventDefault(); onShoot(); });
      document.getElementById('switch-btn').addEventListener('touchstart', (e) => {
        e.preventDefault();
        currentWeaponKey = currentWeaponKey === 'rifle' ? 'pistol' : 'rifle';
        createGunMesh();
      });
    }

    function startGame() {
      document.getElementById('menu-panel').style.display = 'none';
      spawnSupplyBoxes();
      for(let i = 0; i < 5; i++) spawnZombie();

      if (!isMobile) {
        controls.lock();
      }
    }

    function createRuinsOfStPaul() {
      const stoneMat = new THREE.MeshStandardMaterial({ color: 0xd4d4d8 });
      const base = new THREE.Mesh(new THREE.BoxGeometry(22, 12, 2.5), stoneMat);
      base.position.set(0, 6, -60);
      scene.add(base);
      collidableObjects.push(base);

      const evacGeo = new THREE.CylinderGeometry(4, 4, 0.2, 32);
      evacZone = new THREE.Mesh(evacGeo, new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.5 }));
      evacZone.position.set(0, 0.1, -48);
      scene.add(evacZone);
    }

    function createGrandLisboa() {
      const tower = new THREE.Mesh(new THREE.BoxGeometry(10, 60, 6), new THREE.MeshStandardMaterial({ color: 0xfbbf24 }));
      tower.position.set(70, 30, -30);
      scene.add(tower);
    }

    function spawnSupplyBoxes() {
      [{x:-20,z:-10}, {x:20,z:10}, {x:-10,z:30}].forEach(c => {
        const box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0xf59e0b }));
        box.position.set(c.x, 0.6, c.z);
        scene.add(box);
        supplyBoxes.push({ mesh: box, collected: false });
      });
    }

    function spawnZombie() {
      const zombie = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.8), new THREE.MeshStandardMaterial({ color: 0x2e5a27 }));
      const angle = Math.random() * Math.PI * 2;
      zombie.position.set(Math.cos(angle) * 25, 0.9, Math.sin(angle) * 25);
      scene.add(zombie);
      zombies.push({ mesh: zombie, hp: 100, speed: 2.8 });
    }

    function createGunMesh() {
      if (gunMesh) camera.remove(gunMesh);
      const w = weapons[currentWeaponKey];
      gunMesh = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, w.length), new THREE.MeshStandardMaterial({ color: w.color }));
      gunMesh.position.set(0.2, -0.2, -0.4);
      camera.add(gunMesh);
      document.getElementById('weapon-name').innerText = w.name;
    }

    function onShoot() {
      gunMesh.position.z += 0.05;
      setTimeout(() => gunMesh.position.z -= 0.05, 50);

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        if (raycaster.intersectObject(z.mesh).length > 0) {
          z.hp -= weapons[currentWeaponKey].damage;
          if (z.hp <= 0) {
            scene.remove(z.mesh);
            zombies.splice(i, 1);
            killCount++;
            document.getElementById('kills').innerText = killCount;
            setTimeout(spawnZombie, 1500);
          }
          break;
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      // 手機視角更新
      if (isMobile) {
        const phi = THREE.MathUtils.degToRad(90 - lat);
        const theta = THREE.MathUtils.degToRad(lon);
        const target = new THREE.Vector3();
        target.setFromSphericalCoords(1, phi, theta).add(camera.position);
        camera.lookAt(target);

        // 手機移動
        if (moveVector.x !== 0 || moveVector.y !== 0) {
          const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
          forward.y = 0; forward.normalize();
          const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
          side.y = 0; side.normalize();

          camera.position.addScaledVector(forward, moveVector.y * 0.12);
          camera.position.addScaledVector(side, moveVector.x * 0.12);
        }
      } else if (controls && controls.isLocked) {
        // 電腦 PC 移動邏輯
        const speed = 0.12;
        if (moveForward) controls.moveForward(speed);
        if (moveBackward) controls.moveForward(-speed);
        if (moveLeft) controls.moveRight(-speed);
        if (moveRight) controls.moveRight(speed);
      }

      const playerPos = camera.position;

      // 撿物資
      supplyBoxes.forEach(sb => {
        if (!sb.collected && playerPos.distanceTo(sb.mesh.position) < 2.0) {
          sb.collected = true;
          scene.remove(sb.mesh);
          collectedSupplies++;
          document.getElementById('supply-count').innerText = `${collectedSupplies} / ${totalSupplies}`;
          if (collectedSupplies >= totalSupplies) {
            isEvacReady = true;
            document.getElementById('evac-status').innerText = '🟢 已解鎖，快去撤離！';
            document.getElementById('evac-status').style.color = '#10b981';
            evacZone.material.color.setHex(0x10b981);
          }
        }
      });

      // 撤離判定
      if (isEvacReady && playerPos.distanceTo(evacZone.position) < 4.0) {
        alert('🚁 任務成功！安全撤離澳門！');
        location.reload();
      }

      // 喪屍 AI
      zombies.forEach(z => {
        const zPos = z.mesh.position;
        const dist = zPos.distanceTo(playerPos);
        if (dist > 1.2) {
          const dir = new THREE.Vector3().subVectors(playerPos, zPos);
          dir.y = 0; dir.normalize();
          zPos.addScaledVector(dir, z.speed * 0.016);
          z.mesh.lookAt(playerPos.x, 0.9, playerPos.z);
        } else {
          playerHP -= 0.2;
          document.getElementById('hp-bar').style.width = Math.max(0, playerHP) + '%';
          if (playerHP <= 0) {
            alert('🧟‍♂️ 撤離失敗！');
            location.reload();
          }
        }
      });

      renderer.render(scene, camera);
    }

    function onKeyDown(e) {
      if (e.code === 'KeyW') moveForward = true;
      if (e.code === 'KeyS') moveBackward = true;
      if (e.code === 'KeyA') moveLeft = true;
      if (e.code === 'KeyD') moveRight = true;
      if (e.code === 'Digit1') { currentWeaponKey = 'rifle'; createGunMesh(); }
      if (e.code === 'Digit2') { currentWeaponKey = 'pistol'; createGunMesh(); }
    }
    function onKeyUp(e) {
      if (e.code === 'KeyW') moveForward = false;
      if (e.code === 'KeyS') moveBackward = false;
      if (e.code === 'KeyA') moveLeft = false;
      if (e.code === 'KeyD') moveRight = false;
    }
  </script>
</body>
</html>
