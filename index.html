<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CSO Macau: Voxel Street Apocalypse</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #050811; touch-action: none; }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 12px; height: 12px; border: 2px solid #00ffcc;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
      border-radius: 50%; box-shadow: 0 0 10px #00ffcc;
    }
    #ui {
      position: absolute; bottom: 15px; left: 15px;
      color: #fff; font-size: 14px; text-shadow: 2px 2px 4px #000; z-index: 10;
      background: rgba(15, 23, 42, 0.85); padding: 12px 18px; border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.3); backdrop-filter: blur(4px);
    }
    #hp-bar-container {
      width: 160px; height: 14px; background: #1e293b; border: 1px solid #38bdf8; margin-top: 4px; border-radius: 7px; overflow: hidden;
    }
    #hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ef4444, #f87171); transition: width 0.2s; }
    
    #mission-tracker {
      position: absolute; top: 15px; right: 15px;
      background: rgba(15, 23, 42, 0.9); color: #fbbf24;
      padding: 12px 16px; border-radius: 10px; z-index: 10;
      border: 1px solid #fbbf24; font-size: 13px; font-weight: bold;
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
    }

    #loading-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #050811; color: #00ffcc; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100; font-size: 20px;
    }

    /* 手機控制介面 */
    #mobile-controls {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 12; pointer-events: none;
    }
    #joystick-zone {
      position: absolute; bottom: 25px; left: 25px; width: 120px; height: 120px; pointer-events: auto;
    }
    #shoot-btn {
      position: absolute; bottom: 35px; right: 35px; width: 75px; height: 75px;
      background: radial-gradient(circle, #ef4444 0%, #991b1b 100%); border: 2px solid #fff; border-radius: 50%;
      color: white; font-weight: bold; font-size: 16px; pointer-events: auto;
      display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
    }
    #switch-btn {
      position: absolute; bottom: 125px; right: 40px; width: 50px; height: 50px;
      background: rgba(56, 189, 248, 0.85); border: 1px solid #fff; border-radius: 50%;
      color: white; font-size: 12px; pointer-events: auto; font-weight: bold;
      display: flex; justify-content: center; align-items: center;
    }
    #bomb-btn {
      position: absolute; bottom: 125px; right: 100px; width: 50px; height: 50px;
      background: rgba(245, 158, 11, 0.9); border: 1px solid #fff; border-radius: 50%;
      color: white; font-size: 12px; pointer-events: auto; font-weight: bold;
      display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
    }

    #menu-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95); color: white;
      padding: 24px; border-radius: 16px; z-index: 20; width: 85%; max-width: 360px;
      border: 1px solid #fbbf24; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.8);
      display: none;
    }
    .diff-btn {
      padding: 10px; font-size: 14px; margin-top: 8px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; width: 100%; color: white;
    }
    #easy-btn { background: #10b981; }
    #normal-btn { background: #f59e0b; }
    #hard-btn { background: #ef4444; }
  </style>

  <!-- ES Module 導入最新 Three.js 與高階後處理套件 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>

  <div id="loading-screen">
    <div style="margin-bottom: 15px;">🎮 正在載入 3D 街區與高質感材質...</div>
    <div id="progress-text">0%</div>
  </div>

  <div id="crosshair"></div>

  <div id="mission-tracker">
    🎯 任務：【澳門街區突圍】<br>
    📦 搜刮物資：<span id="supply-count" style="color:#fff;">0 / 3</span><br>
    💣 剩餘炸彈：<span id="grenade-count" style="color:#fbbf24;">3</span> 個 (按 3 投擲)<br>
    🚁 撤離點：<span id="evac-status" style="color:#ef4444;">未解鎖</span>
  </div>

  <div id="mobile-controls">
    <div id="joystick-zone"></div>
    <div id="shoot-btn">開槍</div>
    <div id="switch-btn">換槍</div>
    <div id="bomb-btn">💣 炸彈</div>
  </div>

  <div id="menu-panel">
    <h3 style="margin: 0; color: #fbbf24; font-size: 22px;">🇲🇴 澳門生存戰：街區戰場</h3>
    <p style="font-size: 12px; color: #cbd5e1; margin-top: 6px;">
      ✅ 已加載風格化 3D 地圖場景<br>
      請選擇難度以開始遊戲：
    </p>
    <button class="diff-btn" id="easy-btn">🟢 簡單 (Easy)</button>
    <button class="diff-btn" id="normal-btn">🟡 普通 (Normal)</button>
    <button class="diff-btn" id="hard-btn">🔴 困難 (Hard)</button>
  </div>

  <div id="ui">
    <div>血量 HP: <div id="hp-bar-container"><div id="hp-bar"></div></div></div>
    <div style="margin-top:6px;">擊殺: <span id="kills" style="color:#fbbf24;">0</span> | <span id="weapon-name">AK-47</span></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    let scene, camera, renderer, controls;
    let isMobile = false;
    let killCount = 0, playerHP = 100;
    let collectedSupplies = 0, totalSupplies = 3, isEvacReady = false;
    let grenadeCount = 3;

    let difficulty = 'normal';
    let zombieSpeedMultiplier = 1.0;
    let zombieDamageMultiplier = 1.0;

    const collidableBoxes = [];
    const zombies = [], supplyBoxes = [], activeGrenades = [];
    let evacZone = null, gunMesh;

    let moveVector = { x: 0, y: 0 };
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let touchStartX = 0, touchStartY = 0;
    let lon = 0, lat = 0;

    const weapons = {
      rifle: { name: 'AK-47 步槍', color: 0x8B4513, length: 0.9, damage: 45 },
      pistol: { name: 'Glock 18 手槍', color: 0x222222, length: 0.4, damage: 25 },
      grenade: { name: '💣 高爆手榴彈', color: 0x15803d, length: 0.2, damage: 250 }
    };
    let currentWeaponKey = 'rifle';

    if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
      isMobile = true;
    }

    init3D();
    if (isMobile) initMobileUI();
    animate();

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050811);
      scene.fog = new THREE.FogExp2(0x050811, 0.015);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

      // 環境光與燈光
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfbbf24, 1.5);
      dirLight.position.set(30, 60, 20);
      dirLight.castShadow = true;
      scene.add(dirLight);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.body.appendChild(renderer.domElement);

      // 載入 3D 地圖模型 (展示用 Voxel Street 模型網址)
      loadMapModel();

      camera.position.set(0, 1.6, 15);
      if (!isMobile) {
        controls = new PointerLockControls(camera, document.body);
        scene.add(controls.getObject());
      }

      createGunMesh();

      document.getElementById('easy-btn').addEventListener('click', () => setDifficulty('easy'));
      document.getElementById('normal-btn').addEventListener('click', () => setDifficulty('normal'));
      document.getElementById('hard-btn').addEventListener('click', () => setDifficulty('hard'));

      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      document.addEventListener('mousedown', (e) => {
        if(!isMobile && controls && controls.isLocked) {
          if (currentWeaponKey === 'grenade') throwGrenade();
          else onShoot();
        }
      });

      if (isMobile) {
        document.addEventListener('touchstart', (e) => {
          if (e.touches[0].clientX > window.innerWidth / 2) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
          }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
          for (let touch of e.touches) {
            if (touch.clientX > window.innerWidth / 2) {
              const deltaX = touch.clientX - touchStartX;
              const deltaY = touch.clientY - touchStartY;
              lon -= deltaX * 0.25;
              lat -= deltaY * 0.25;
              lat = Math.max(-85, Math.min(85, lat));
              touchStartX = touch.clientX;
              touchStartY = touch.clientY;
            }
          }
        }, { passive: false });
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // --- 載入風格化 3D 街區模型 ---
    function loadMapModel() {
      const loader = new GLTFLoader();
      
      // 使用三維空間範例街區 GLB 檔案
      const modelUrl = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/UrbanLandscape/glTF-Binary/UrbanLandscape.glb';

      loader.load(modelUrl, (gltf) => {
        const model = gltf.scene;
        model.scale.set(2, 2, 2);
        model.position.set(0, 0, 0);

        model.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        scene.add(model);

        // 建立地面與撤離光圈
        createEvacZone();

        // 隱藏載入畫面，顯示遊戲選單
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('menu-panel').style.display = 'block';

      }, (xhr) => {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          document.getElementById('progress-text').innerText = percent + '%';
        }
      }, (error) => {
        console.error('模型載入失敗，降級為備用街區:', error);
        createFallbackStreet();
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('menu-panel').style.display = 'block';
      });
    }

    function createFallbackStreet() {
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(200, 200),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);
      createEvacZone();
    }

    function createEvacZone() {
      const evacGeo = new THREE.CylinderGeometry(4.5, 4.5, 0.2, 32);
      evacZone = new THREE.Mesh(evacGeo, new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.6 }));
      evacZone.position.set(0, 0.1, -40);
      scene.add(evacZone);
    }

    function setDifficulty(diff) {
      difficulty = diff;
      if (diff === 'easy') {
        zombieSpeedMultiplier = 0.8; zombieDamageMultiplier = 0.6;
      } else if (diff === 'normal') {
        zombieSpeedMultiplier = 1.0; zombieDamageMultiplier = 1.0;
      } else {
        zombieSpeedMultiplier = 1.3; zombieDamageMultiplier = 1.6;
      }
      startGame();
    }

    function startGame() {
      document.getElementById('menu-panel').style.display = 'none';
      spawnSupplyBoxes();
      for(let i = 0; i < 6; i++) spawnZombie();
      if (!isMobile) controls.lock();
    }

    // 擬真喪屍模型
    function spawnZombie() {
      const zombieGroup = new THREE.Group();

      const skinMat = new THREE.MeshStandardMaterial({ color: 0x1c3d1c, roughness: 0.9 });
      const clothMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });

      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.15, 0.4), clothMat);
      torso.position.y = 1.15; torso.rotation.x = 0.2; torso.castShadow = true;
      zombieGroup.add(torso);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.48, 0.48), skinMat);
      head.position.set(0, 1.85, 0.12); head.castShadow = true;
      zombieGroup.add(head);

      const eyeGeo = new THREE.SphereGeometry(0.06); const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const e1 = new THREE.Mesh(eyeGeo, eyeMat); e1.position.set(-0.12, 1.9, 0.35);
      const e2 = new THREE.Mesh(eyeGeo, eyeMat); e2.position.set(0.12, 1.9, 0.35);
      zombieGroup.add(e1, e2);

      const armGeo = new THREE.BoxGeometry(0.18, 0.85, 0.18);
      const armL = new THREE.Mesh(armGeo, skinMat); armL.position.set(-0.48, 1.3, 0.2); armL.castShadow = true;
      const armR = new THREE.Mesh(armGeo, skinMat); armR.position.set(0.48, 1.3, 0.2); armR.castShadow = true;
      zombieGroup.add(armL, armR);

      const angle = Math.random() * Math.PI * 2; const dist = 25 + Math.random() * 20;
      zombieGroup.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);

      scene.add(zombieGroup);
      zombies.push({
        mesh: zombieGroup,
        armL: armL, armR: armR,
        hp: 100,
        speed: 3.2 * zombieSpeedMultiplier,
        walkAnimOffset: Math.random() * 100
      });
    }

    function throwGrenade() {
      if (grenadeCount <= 0) return alert('💣 手榴彈用完了！');
      grenadeCount--; document.getElementById('grenade-count').innerText = grenadeCount;

      const grenade = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 12), new THREE.MeshStandardMaterial({ color: 0x15803d }));
      grenade.position.copy(camera.position);

      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      const vel = dir.multiplyScalar(20); vel.y += 6;

      scene.add(grenade); activeGrenades.push({ mesh: grenade, vel: vel });
    }

    function initMobileUI() {
      document.getElementById('mobile-controls').style.display = 'block';

      const manager = nipplejs.create({
        zone: document.getElementById('joystick-zone'), mode: 'static',
        position: { left: '60px', bottom: '60px' }, color: 'white'
      });

      manager.on('move', (evt, data) => { if (data.vector) { moveVector.x = data.vector.x; moveVector.y = data.vector.y; } });
      manager.on('end', () => { moveVector.x = 0; moveVector.y = 0; });

      document.getElementById('shoot-btn').addEventListener('touchstart', (e) => { e.preventDefault(); onShoot(); });
      document.getElementById('switch-btn').addEventListener('touchstart', (e) => {
        e.preventDefault(); currentWeaponKey = currentWeaponKey === 'rifle' ? 'pistol' : 'rifle'; createGunMesh();
      });
      document.getElementById('bomb-btn').addEventListener('touchstart', (e) => {
        e.preventDefault(); currentWeaponKey = 'grenade'; throwGrenade();
      });
    }

    function spawnSupplyBoxes() {
      [{x:-15,z:-15}, {x:20,z:15}, {x:-20,z:20}].forEach(c => {
        const box = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), new THREE.MeshStandardMaterial({ color: 0xfbbf24 }));
        box.position.set(c.x, 0.7, c.z); scene.add(box); supplyBoxes.push({ mesh: box, collected: false });
      });
    }

    function createGunMesh() {
      if (gunMesh) camera.remove(gunMesh);
      const w = weapons[currentWeaponKey];
      gunMesh = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, w.length), new THREE.MeshStandardMaterial({ color: w.color }));
      gunMesh.position.set(0.2, -0.2, -0.4); camera.add(gunMesh);
      document.getElementById('weapon-name').innerText = w.name;
    }

    function onShoot() {
      gunMesh.position.z += 0.06; setTimeout(() => gunMesh.position.z -= 0.06, 50);

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        if (raycaster.intersectObjects(z.mesh.children).length > 0) {
          z.hp -= weapons[currentWeaponKey].damage;
          if (z.hp <= 0) {
            scene.remove(z.mesh); zombies.splice(i, 1);
            killCount++; document.getElementById('kills').innerText = killCount;
            setTimeout(spawnZombie, 1200);
          }
          break;
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const time = performance.now() * 0.005;

      // 手榴彈軌跡
      for(let i = activeGrenades.length - 1; i >= 0; i--) {
        const g = activeGrenades[i];
        g.mesh.position.addScaledVector(g.vel, 0.016); g.vel.y -= 9.8 * 0.016;

        if (g.mesh.position.y <= 0.2) {
          const flash = new THREE.PointLight(0xff4400, 10, 15); flash.position.copy(g.mesh.position); scene.add(flash);
          setTimeout(() => scene.remove(flash), 300);

          zombies.forEach((z) => {
            if (z.mesh.position.distanceTo(g.mesh.position) < 9.0) z.hp -= 250;
          });

          scene.remove(g.mesh); activeGrenades.splice(i, 1);
        }
      }

      if (isMobile) {
        const phi = THREE.MathUtils.degToRad(90 - lat); const theta = THREE.MathUtils.degToRad(lon);
        const target = new THREE.Vector3(); target.setFromSphericalCoords(1, phi, theta).add(camera.position); camera.lookAt(target);

        if (moveVector.x !== 0 || moveVector.y !== 0) {
          const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); forward.y = 0; forward.normalize();
          const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion); side.y = 0; side.normalize();
          camera.position.addScaledVector(forward, moveVector.y * 0.14); camera.position.addScaledVector(side, moveVector.x * 0.14);
        }
      } else if (controls && controls.isLocked) {
        const speed = 0.14;
        if (moveForward) controls.moveForward(speed); if (moveBackward) controls.moveForward(-speed);
        if (moveLeft) controls.moveRight(-speed); if (moveRight) controls.moveRight(speed);
      }

      const playerPos = camera.position;

      // 撿物資判定
      supplyBoxes.forEach(sb => {
        if (!sb.collected && playerPos.distanceTo(sb.mesh.position) < 2.2) {
          sb.collected = true; scene.remove(sb.mesh); collectedSupplies++;
          document.getElementById('supply-count').innerText = `${collectedSupplies} / ${totalSupplies}`;

          if (collectedSupplies >= totalSupplies) {
            isEvacReady = true;
            document.getElementById('evac-status').innerText = '🟢 已解鎖，前往撤離點！';
            document.getElementById('evac-status').style.color = '#10b981'; evacZone.material.color.setHex(0x10b981);
          }
        }
      });

      // 撤離判定
      if (isEvacReady && playerPos.distanceTo(evacZone.position) < 4.5) {
        alert('🚁 任務成功！你已安全撤離！'); location.reload();
      }

      // 喪屍 AI 與步履蹣跚動畫
      zombies.forEach(z => {
        const zPos = z.mesh.position; const dist = zPos.distanceTo(playerPos);
        if (dist > 1.2) {
          const dir = new THREE.Vector3().subVectors(playerPos, zPos); dir.y = 0; dir.normalize();
          zPos.addScaledVector(dir, z.speed * 0.016); z.mesh.lookAt(playerPos.x, 0, playerPos.z);

          const anim = Math.sin(time * 3 + z.walkAnimOffset);
          z.armL.rotation.x = -Math.PI / 2.3 + anim * 0.2;
          z.armR.rotation.x = -Math.PI / 2.3 - anim * 0.2;
          z.mesh.rotation.z = anim * 0.05;
        } else {
          playerHP -= 0.25 * zombieDamageMultiplier;
          document.getElementById('hp-bar').style.width = Math.max(0, playerHP) + '%';
          if (playerHP <= 0) { alert('🧟‍♂️ 撤離失敗！你被喪屍圍攻了！'); location.reload(); }
        }
      });

      renderer.render(scene, camera);
    }

    function onKeyDown(e) {
      if (e.code === 'KeyW') moveForward = true; if (e.code === 'KeyS') moveBackward = true;
      if (e.code === 'KeyA') moveLeft = true; if (e.code === 'KeyD') moveRight = true;
      if (e.code === 'Digit1') { currentWeaponKey = 'rifle'; createGunMesh(); }
      if (e.code === 'Digit2') { currentWeaponKey = 'pistol'; createGunMesh(); }
      if (e.code === 'Digit3') { currentWeaponKey = 'grenade'; createGunMesh(); throwGrenade(); }
    }
    function onKeyUp(e) {
      if (e.code === 'KeyW') moveForward = false; if (e.code === 'KeyS') moveBackward = false;
      if (e.code === 'KeyA') moveLeft = false; if (e.code === 'KeyD') moveRight = false;
    }
  </script>
</body>
</html>
