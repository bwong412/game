<!DOCTYPE html>
<html lang="zh-Hant-MO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>澳門 GTA · 鏡海狂飆</title>
  <style>
    body { margin: 0; overflow: hidden; background: #07080c; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui {
      position: absolute; top: 20px; left: 20px; color: #fff;
      background: rgba(0,0,0,0.6); padding: 12px 20px; border-radius: 8px;
      border-left: 4px solid #008751; pointer-events: none;
    }
    #ui h1 { margin: 0 0 5px 0; font-size: 18px; color: #ffc72c; }
    #ui p { margin: 0; font-size: 13px; color: #ccc; }
  </style>
  <!-- 引入 Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="ui">
    <h1>澳門 GTA · 鏡海狂飆</h1>
    <p>控制方式：按 W A S D / 方向鍵 移動</p>
  </div>
  <div id="canvas-container"></div>

  <script>
    // 1. 初始化場景
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0c10);
    scene.fog = new THREE.FogExp2(0x0a0c10, 0.015);

    // 2. 相機
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

    // 3. 渲染器 (開啟陰影)
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 4. 光照 (澳門夜景氛圍)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfffaed, 1.2);
    dirLight.position.set(20, 40, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // 5. 地面 (馬路與黑黃賽車邊線感)
    const groundGeo = new THREE.PlaneGeometry(200, 200);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x1a1d24, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // 6. 簡易澳門地標 (用不同顏色的方塊代表)
    function createBuilding(x, z, w, h, d, color, name) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({ color: color });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
    }

    // 創建代表建築：新葡京(金/紅)、葡京(綠)、大三巴區域
    createBuilding(0, -30, 12, 35, 12, 0xff0055);  // 新葡京地塊
    createBuilding(-25, -15, 15, 15, 15, 0x008751); // 澳門綠建築
    createBuilding(25, -20, 10, 20, 10, 0xffc72c);  // 澳門黃建築

    // 7. 玩家 (暫時用小電單車/角色方塊)
    const playerGroup = new THREE.Group();
    
    // 車身/人體
    const bodyGeo = new THREE.BoxGeometry(1.2, 1.8, 1.2);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffc72c }); // 澳門黃
    const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
    bodyMesh.position.y = 0.9;
    bodyMesh.castShadow = true;
    playerGroup.add(bodyMesh);

    // 車頭燈指示方向
    const headGeo = new THREE.BoxGeometry(0.8, 0.4, 0.4);
    const headMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const headMesh = new THREE.Mesh(headGeo, headMat);
    headMesh.position.set(0, 1.2, -0.6);
    playerGroup.add(headMesh);

    scene.add(playerGroup);

    // 8. 移動與控制邏輯
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    let speed = 0;
    let angle = 0;

    function animate() {
      requestAnimationFrame(animate);

      // 加減速與轉向
      if (keys['KeyW'] || keys['ArrowUp']) speed = Math.min(speed + 0.01, 0.25);
      else if (keys['KeyS'] || keys['ArrowDown']) speed = Math.max(speed - 0.01, -0.1);
      else speed *= 0.95; // 自然阻尼煞車

      if (keys['KeyA'] || keys['ArrowLeft']) angle += 0.04;
      if (keys['KeyD'] || keys['ArrowRight']) angle -= 0.04;

      // 更新玩家位置與角度
      playerGroup.rotation.y = angle;
      playerGroup.position.x -= Math.sin(angle) * speed;
      playerGroup.position.z -= Math.cos(angle) * speed;

      // 第三人稱相機 Smoothing 跟隨
      const camOffset = new THREE.Vector3(
        playerGroup.position.x + Math.sin(angle) * 8,
        playerGroup.position.y + 5,
        playerGroup.position.z + Math.cos(angle) * 8
      );
      camera.position.lerp(camOffset, 0.1);
      camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1.2, playerGroup.position.z);

      renderer.render(scene, camera);
    }

    // 視窗自動縮放
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
