<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CSO Macau: Boss Apocalypse</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #050811; touch-action: none; }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 12px; height: 12px; border: 2px solid #00ffcc;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
      border-radius: 50%; box-shadow: 0 0 8px #00ffcc;
    }
    #ui {
      position: absolute; bottom: 15px; left: 15px;
      color: #fff; font-size: 14px; text-shadow: 2px 2px 4px #000; z-index: 10;
      background: rgba(15, 23, 42, 0.85); padding: 12px 18px; border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.3); backdrop-filter: blur(4px);
    }
    #hp-bar-container {
      width: 160px; height: 14px; background: #1e293b; border: 1px solid #38bdf8; margin-top: 4px; border-radius: 7px; overflow: hidden;
    }
    #hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ef4444, #f87171); transition: width 0.2s; }
    
    #mission-tracker {
      position: absolute; top: 15px; right: 15px;
      background: rgba(15, 23, 42, 0.9); color: #fbbf24;
      padding: 12px 16px; border-radius: 10px; z-index: 10;
      border: 1px solid #fbbf24; font-size: 13px; font-weight: bold;
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
    }

    #boss-warning {
      display: none; position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%);
      color: #ef4444; font-size: 26px; font-weight: bold; text-shadow: 0 0 10px #ff0000;
      z-index: 15; text-align: center; animation: blink 0.8s infinite alternate;
    }
    @keyframes blink { from { opacity: 0.2; } to { opacity: 1; } }

    /* 手機介面 */
    #mobile-controls {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 12; pointer-events: none;
    }
    #joystick-zone {
      position: absolute; bottom: 25px; left: 25px; width: 120px; height: 120px; pointer-events: auto;
    }
    #shoot-btn {
      position: absolute; bottom: 35px; right: 35px; width: 75px; height: 75px;
      background: radial-gradient(circle, #ef4444 0%, #991b1b 100%); border: 2px solid #fff; border-radius: 50%;
      color: white; font-weight: bold; font-size: 16px; pointer-events: auto;
      display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
    }
    #switch-btn {
      position: absolute; bottom: 125px; right: 40px; width: 50px; height: 50px;
      background: rgba(56, 189, 248, 0.85); border: 1px solid #fff; border-radius: 50%;
      color: white; font-size: 12px; pointer-events: auto; font-weight: bold;
      display: flex; justify-content: center; align-items: center;
    }
    #bomb-btn {
      position: absolute; bottom: 125px; right: 100px; width: 50px; height: 50px;
      background: rgba(245, 158, 11, 0.9); border: 1px solid #fff; border-radius: 50%;
      color: white; font-size: 12px; pointer-events: auto; font-weight: bold;
      display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
    }

    #menu-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95); color: white;
      padding: 24px; border-radius: 16px; z-index: 20; width: 85%; max-width: 360px;
      border: 1px solid #fbbf24; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    .diff-btn {
      padding: 10px; font-size: 14px; margin-top: 8px; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; width: 100%; color: white;
    }
    #easy-btn { background: #10b981; }
    #normal-btn { background: #f59e0b; }
    #hard-btn { background: #ef4444; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>

  <div id="crosshair"></div>

  <div id="boss-warning">⚠️ 警告：澳門喪屍王 (BOSS) 降臨！</div>

  <div id="mission-tracker">
    🎯 任務：【澳門撤離行動】<br>
    📦 搜刮物資：<span id="supply-count" style="color:#fff;">0 / 3</span><br>
    💣 剩餘炸彈：<span id="grenade-count" style="color:#fbbf24;">3</span> 個 (按 3 投擲)<br>
    👹 BOSS 狀態：<span id="boss-status" style="color:#aaa;">未出現 (第2物資解鎖)</span><br>
    🚁 大三巴撤離點：<span id="evac-status" style="color:#ef4444;">未解鎖</span>
  </div>

  <div id="mobile-controls">
    <div id="joystick-zone"></div>
    <div id="shoot-btn">開槍</div>
    <div id="switch-btn">換槍</div>
    <div id="bomb-btn">💣 炸彈</div>
  </div>

  <div id="menu-panel">
    <h3 style="margin: 0; color: #fbbf24; font-size: 22px;">🇲🇴 澳門生存戰：Boss 降臨</h3>
    <p style="font-size: 12px; color: #cbd5e1; margin-top: 6px;">
      地標：大三巴、旅遊塔、觀音像、媽閣廟、細節 Apple Store<br>
      請選擇遊戲難度以開始戰鬥：
    </p>
    <button class="diff-btn" id="easy-btn">🟢 簡單 (Easy)</button>
    <button class="diff-btn" id="normal-btn">🟡 普通 (Normal)</button>
    <button class="diff-btn" id="hard-btn">🔴 困難 (Hard - Boss 極強)</button>
  </div>

  <div id="ui">
    <div>血量 HP: <div id="hp-bar-container"><div id="hp-bar"></div></div></div>
    <div style="margin-top:6px;">擊殺: <span id="kills" style="color:#fbbf24;">0</span> | <span id="weapon-name">AK-47</span></div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let isMobile = false;
    let killCount = 0, playerHP = 100, maxHP = 100;
    let collectedSupplies = 0, totalSupplies = 3, isEvacReady = false;
    let grenadeCount = 3;

    // 難度參數
    let difficulty = 'normal';
    let zombieSpeedMultiplier = 1.0;
    let zombieDamageMultiplier = 1.0;
    let bossMaxHP = 800, bossCurrentHP = 800;
    let bossMesh = null, isBossAlive = false;

    const collidableObjects = [], zombies = [], supplyBoxes = [], activeGrenades = [];
    let evacZone = null, gunMesh;

    let moveVector = { x: 0, y: 0 };
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let touchStartX = 0, touchStartY = 0;
    let lon = 0, lat = 0;

    const weapons = {
      rifle: { name: 'AK-47 步槍', color: 0x8B4513, length: 0.9, damage: 45 },
      pistol: { name: 'Glock 18 手槍', color: 0x222222, length: 0.4, damage: 25 },
      grenade: { name: '💣 高爆手榴彈', color: 0x15803d, length: 0.2, damage: 250 }
    };
    let currentWeaponKey = 'rifle';

    if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
      isMobile = true;
    }

    init3D();
    if (isMobile) initMobileUI();
    animate();

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060913);
      scene.fog = new THREE.FogExp2(0x060913, 0.012);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

      const ambientLight = new THREE.AmbientLight(0xddeeff, 0.5);
      scene.add(ambientLight);

      const casinoLight = new THREE.DirectionalLight(0xfbbf24, 1.2);
      casinoLight.position.set(60, 90, 40);
      scene.add(casinoLight);

      // 馬路
      createRoadSystem();

      // 澳門所有真實地標
      createDetailedRuinsOfStPaul();
      createMacauTower();
      createKunIamStatue();
      createAMaTemple();
      createDetailedAppleStore();
      createGrandLisboa();
      createWynnPalace();
      createPataneMarket();
      
      // 密集高樓大廈與唐樓街區
      createDenseSkyscrapersAndTongLau();

      camera.position.set(0, 1.6, 20);
      if (!isMobile) {
        controls = new THREE.PointerLockControls(camera, document.body);
        scene.add(controls.getObject());
      }

      createGunMesh();

      document.getElementById('easy-btn').addEventListener('click', () => setDifficulty('easy'));
      document.getElementById('normal-btn').addEventListener('click', () => setDifficulty('normal'));
      document.getElementById('hard-btn').addEventListener('click', () => setDifficulty('hard'));

      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      document.addEventListener('mousedown', (e) => {
        if(!isMobile && controls && controls.isLocked) {
          if (currentWeaponKey === 'grenade') throwGrenade();
          else onShoot();
        }
      });

      if (isMobile) {
        document.addEventListener('touchstart', (e) => {
          if (e.touches[0].clientX > window.innerWidth / 2) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
          }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
          for (let touch of e.touches) {
            if (touch.clientX > window.innerWidth / 2) {
              const deltaX = touch.clientX - touchStartX;
              const deltaY = touch.clientY - touchStartY;
              lon -= deltaX * 0.25;
              lat -= deltaY * 0.25;
              lat = Math.max(-85, Math.min(85, lat));
              touchStartX = touch.clientX;
              touchStartY = touch.clientY;
            }
          }
        }, { passive: false });
      }

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.body.appendChild(renderer.domElement);
    }

    function setDifficulty(diff) {
      difficulty = diff;
      if (diff === 'easy') {
        zombieSpeedMultiplier = 0.8; zombieDamageMultiplier = 0.6; bossMaxHP = 500;
      } else if (diff === 'normal') {
        zombieSpeedMultiplier = 1.0; zombieDamageMultiplier = 1.0; bossMaxHP = 800;
      } else {
        zombieSpeedMultiplier = 1.3; zombieDamageMultiplier = 1.6; bossMaxHP = 1400;
      }
      bossCurrentHP = bossMaxHP;
      startGame();
    }

    function startGame() {
      document.getElementById('menu-panel').style.display = 'none';
      spawnSupplyBoxes();
      for(let i = 0; i < 6; i++) spawnZombie();
      if (!isMobile) controls.lock();
    }

    function createRoadSystem() {
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(350, 350), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 }));
      ground.rotation.x = -Math.PI / 2; scene.add(ground);

      const roadMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 });
      const mainRoadNS = new THREE.Mesh(new THREE.PlaneGeometry(20, 320), roadMat);
      mainRoadNS.rotation.x = -Math.PI / 2; mainRoadNS.position.y = 0.02; scene.add(mainRoadNS);

      const mainRoadEW = new THREE.Mesh(new THREE.PlaneGeometry(320, 20), roadMat);
      mainRoadEW.rotation.x = -Math.PI / 2; mainRoadEW.position.y = 0.02; scene.add(mainRoadEW);
    }

    // --- 🏛️ 大三巴牌坊 ---
    function createDetailedRuinsOfStPaul() {
      const group = new THREE.Group();
      const stoneMat = new THREE.MeshStandardMaterial({ color: 0xc8c8cf, roughness: 0.6 });
      const base = new THREE.Mesh(new THREE.BoxGeometry(26, 7, 2.8), stoneMat);
      base.position.set(0, 6.5, 0); group.add(base);

      for(let x of [-7.5, 0, 7.5]) {
        const arch = new THREE.Mesh(new THREE.BoxGeometry(3.6, 4.8, 2.9), new THREE.MeshBasicMaterial({ color: 0x000000 }));
        arch.position.set(x, 5.4, 0); group.add(arch);
      }

      const layer2 = new THREE.Mesh(new THREE.BoxGeometry(20, 6, 2.4), stoneMat); layer2.position.set(0, 13, 0); group.add(layer2);
      const layer3 = new THREE.Mesh(new THREE.BoxGeometry(14, 5, 2.0), stoneMat); layer3.position.set(0, 18.5, 0); group.add(layer3);

      const cross = new THREE.Mesh(new THREE.BoxGeometry(0.8, 3.8, 0.4), new THREE.MeshBasicMaterial({ color: 0xfbbf24 }));
      cross.position.set(0, 23, 0); group.add(cross);

      group.position.set(0, 0, -95); scene.add(group); collidableObjects.push(base, layer2);

      const evacGeo = new THREE.CylinderGeometry(4.5, 4.5, 0.2, 32);
      evacZone = new THREE.Mesh(evacGeo, new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.5 }));
      evacZone.position.set(0, 0.1, -78); scene.add(evacZone);
    }

    // --- 🗼 澳門旅遊塔 (Macau Tower) ---
    function createMacauTower() {
      const group = new THREE.Group();
      const towerMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, metalness: 0.7, roughness: 0.3 });

      // 主塔幹
      const body = new THREE.Mesh(new THREE.CylinderGeometry(2, 3.5, 110, 16), towerMat);
      body.position.y = 55; group.add(body);

      // 圓盤觀景台 (Observation Deck)
      const deck = new THREE.Mesh(new THREE.CylinderGeometry(10, 8, 8, 24), new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.8 }));
      deck.position.y = 90; group.add(deck);

      // 頂部避雷針尖塔
      const needle = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.6, 25), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      needle.position.y = 106; group.add(needle);

      group.position.set(100, 0, 80); scene.add(group); collidableObjects.push(body);
    }

    // --- 🗿 觀音蓮花苑 (Kun Iam Ecumenical Centre) ---
    function createKunIamStatue() {
      const group = new THREE.Group();
      
      // 蓮花底座
      const baseMat = new THREE.MeshStandardMaterial({ color: 0xf43f5e, roughness: 0.4 });
      const base = new THREE.Mesh(new THREE.CylinderGeometry(8, 12, 6, 16), baseMat);
      base.position.y = 3; group.add(base);

      // 金色觀音像
      const statueMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.9, roughness: 0.1 });
      const body = new THREE.Mesh(new THREE.ConeGeometry(3, 18, 16), statueMat);
      body.position.y = 15; group.add(body);

      group.position.set(-90, 0, 90); scene.add(group); collidableObjects.push(base);
    }

    // --- ⛩️ 媽閣廟 (A-Ma Temple) ---
    function createAMaTemple() {
      const group = new THREE.Group();
      const wallMat = new THREE.MeshStandardMaterial({ color: 0xb91c1c }); // 經典紅色廟牆
      
      const mainTemple = new THREE.Mesh(new THREE.BoxGeometry(16, 7, 12), wallMat);
      mainTemple.position.y = 3.5; group.add(mainTemple);

      // 飛簷綠瓦廟頂
      const roofMat = new THREE.MeshStandardMaterial({ color: 0x047857 });
      const roof = new THREE.Mesh(new THREE.ConeGeometry(13, 4, 4), roofMat);
      roof.position.y = 9; roof.rotation.y = Math.PI / 4; group.add(roof);

      group.position.set(-80, 0, -80); scene.add(group); collidableObjects.push(mainTemple);
    }

    // --- 🍎 超細節 澳門 Apple Store ---
    function createDetailedAppleStore() {
      const group = new THREE.Group();

      // 雙層透明玻璃外牆
      const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, roughness: 0.1, transmission: 0.9 });
      const cube = new THREE.Mesh(new THREE.BoxGeometry(16, 12, 16), glassMat);
      cube.position.y = 6; group.add(cube);

      // 內部木質長桌 (Apple Display Tables)
      const woodMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.4 });
      for(let x of [-4, 4]) {
        for(let z of [-4, 4]) {
          const table = new THREE.Mesh(new THREE.BoxGeometry(3, 1.2, 2), woodMat);
          table.position.set(x, 0.6, z); group.add(table);
        }
      }

      // 發光 Apple Logo
      const logoMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const logo = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), logoMat);
      logo.position.set(0, 6, 8.1); group.add(logo);

      group.position.set(-60, 0, 45); scene.add(group); collidableObjects.push(cube);
    }

    function createGrandLisboa() {
      const tower = new THREE.Mesh(new THREE.BoxGeometry(14, 75, 8), new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.9 }));
      tower.position.set(85, 37.5, -45); scene.add(tower); collidableObjects.push(tower);
    }

    function createWynnPalace() {
      const hotel = new THREE.Mesh(new THREE.BoxGeometry(45, 30, 16), new THREE.MeshStandardMaterial({ color: 0xeab308, metalness: 0.8 }));
      hotel.position.set(-85, 15, -35); scene.add(hotel); collidableObjects.push(hotel);
    }

    function createPataneMarket() {
      const market = new THREE.Mesh(new THREE.BoxGeometry(28, 15, 20), new THREE.MeshStandardMaterial({ color: 0x334155 }));
      market.position.set(60, 7.5, 45); scene.add(market); collidableObjects.push(market);
    }

    // --- 🏢 密集大樓與澳門唐樓街區 ---
    function createDenseSkyscrapersAndTongLau() {
      const configs = [
        {x: -35, z: -25, h: 22}, {x: 35, z: -25, h: 26},
        {x: -35, z: 20, h: 18}, {x: 35, z: 20, h: 24},
        {x: -35, z: 65, h: 28}, {x: 35, z: 65, h: 32}
      ];

      configs.forEach(c => {
        const body = new THREE.Mesh(new THREE.BoxGeometry(18, c.h, 18), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.7 }));
        body.position.set(c.x, c.h/2, c.z); scene.add(body); collidableObjects.push(body);
      });
    }

    // --- 👹 召喚巨型 BOSS (澳門喪屍王) ---
    function spawnBossZombie() {
      isBossAlive = true;
      document.getElementById('boss-warning').style.display = 'block';
      setTimeout(() => document.getElementById('boss-warning').style.display = 'none', 3500);

      const bossGroup = new THREE.Group();
      const bossSkinMat = new THREE.MeshStandardMaterial({ color: 0x7f1d1d, roughness: 0.5 }); // 血紅肌膚

      // 巨型身體 (3倍大)
      const torso = new THREE.Mesh(new THREE.BoxGeometry(2.4, 3.6, 1.2), bossSkinMat); torso.position.y = 3.6; bossGroup.add(torso);
      const head = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), bossSkinMat); head.position.y = 6.0; bossGroup.add(head);

      // BOSS 發光紅眼
      const eyeGeo = new THREE.SphereGeometry(0.25); const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const e1 = new THREE.Mesh(eyeGeo, eyeMat); e1.position.set(-0.4, 6.1, 0.8);
      const e2 = new THREE.Mesh(eyeGeo, eyeMat); e2.position.set(0.4, 6.1, 0.8);
      bossGroup.add(e1, e2);

      // 巨型手臂
      const armGeo = new THREE.BoxGeometry(0.6, 2.5, 0.6);
      const armL = new THREE.Mesh(armGeo, bossSkinMat); armL.position.set(-1.5, 4.2, 1.0); armL.rotation.x = -Math.PI / 2.2;
      const armR = new THREE.Mesh(armGeo, bossSkinMat); armR.position.set(1.5, 4.2, 1.0); armR.rotation.x = -Math.PI / 2.2;
      bossGroup.add(armL, armR);

      // BOSS 登場位置 (大三巴前方街道)
      bossGroup.position.set(0, 0, -45);
      scene.add(bossGroup);
      bossMesh = bossGroup;

      document.getElementById('boss-status').innerText = '🔥 存活 (極危險！)';
      document.getElementById('boss-status').style.color = '#ef4444';
    }

    function throwGrenade() {
      if (grenadeCount <= 0) return alert('💣 手榴彈用完了！');
      grenadeCount--; document.getElementById('grenade-count').innerText = grenadeCount;

      const grenade = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 12), new THREE.MeshStandardMaterial({ color: 0x15803d }));
      grenade.position.copy(camera.position);

      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      const vel = dir.multiplyScalar(20); vel.y += 6;

      scene.add(grenade);
      activeGrenades.push({ mesh: grenade, vel: vel });
    }

    function spawnZombie() {
      const zombieGroup = new THREE.Group();
      const skinMat = new THREE.MeshStandardMaterial({ color: 0x224422 });
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.15, 0.4), new THREE.MeshStandardMaterial({ color: 0x0f172a })); torso.position.y = 1.15; zombieGroup.add(torso);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.48, 0.48), skinMat); head.position.y = 1.9; zombieGroup.add(head);

      const angle = Math.random() * Math.PI * 2; const dist = 30 + Math.random() * 25;
      zombieGroup.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);

      scene.add(zombieGroup);
      zombies.push({ mesh: zombieGroup, hp: 100, speed: 3.2 * zombieSpeedMultiplier });
    }

    function initMobileUI() {
      document.getElementById('mobile-controls').style.display = 'block';

      const manager = nipplejs.create({
        zone: document.getElementById('joystick-zone'), mode: 'static',
        position: { left: '60px', bottom: '60px' }, color: 'white'
      });

      manager.on('move', (evt, data) => { if (data.vector) { moveVector.x = data.vector.x; moveVector.y = data.vector.y; } });
      manager.on('end', () => { moveVector.x = 0; moveVector.y = 0; });

      document.getElementById('shoot-btn').addEventListener('touchstart', (e) => { e.preventDefault(); onShoot(); });
      document.getElementById('switch-btn').addEventListener('touchstart', (e) => {
        e.preventDefault(); currentWeaponKey = currentWeaponKey === 'rifle' ? 'pistol' : 'rifle'; createGunMesh();
      });
      document.getElementById('bomb-btn').addEventListener('touchstart', (e) => {
        e.preventDefault(); currentWeaponKey = 'grenade'; throwGrenade();
      });
    }

    function spawnSupplyBoxes() {
      [{x:-20,z:-20}, {x:35,z:20}, {x:-30,z:30}].forEach(c => {
        const box = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), new THREE.MeshStandardMaterial({ color: 0xfbbf24 }));
        box.position.set(c.x, 0.7, c.z); scene.add(box); supplyBoxes.push({ mesh: box, collected: false });
      });
    }

    function createGunMesh() {
      if (gunMesh) camera.remove(gunMesh);
      const w = weapons[currentWeaponKey];
      gunMesh = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, w.length), new THREE.MeshStandardMaterial({ color: w.color }));
      gunMesh.position.set(0.2, -0.2, -0.4); camera.add(gunMesh);
      document.getElementById('weapon-name').innerText = w.name;
    }

    function onShoot() {
      gunMesh.position.z += 0.06; setTimeout(() => gunMesh.position.z -= 0.06, 50);

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      // 擊中 BOSS 判定
      if (isBossAlive && bossMesh) {
        if (raycaster.intersectObjects(bossMesh.children).length > 0) {
          bossCurrentHP -= weapons[currentWeaponKey].damage;
          if (bossCurrentHP <= 0) {
            scene.remove(bossMesh); isBossAlive = false;
            killCount += 10; document.getElementById('kills').innerText = killCount;
            document.getElementById('boss-status').innerText = '🟢 已消滅';
            document.getElementById('boss-status').style.color = '#10b981';
            alert('🎉 恭喜！你成功擊敗了「澳門喪屍王 BOSS」！');
          }
          return;
        }
      }

      // 擊中普通喪屍
      for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        if (raycaster.intersectObjects(z.mesh.children).length > 0) {
          z.hp -= weapons[currentWeaponKey].damage;
          if (z.hp <= 0) {
            scene.remove(z.mesh); zombies.splice(i, 1);
            killCount++; document.getElementById('kills').innerText = killCount;
            setTimeout(spawnZombie, 1200);
          }
          break;
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      // 手榴彈軌跡與爆炸
      for(let i = activeGrenades.length - 1; i >= 0; i--) {
        const g = activeGrenades[i];
        g.mesh.position.addScaledVector(g.vel, 0.016); g.vel.y -= 9.8 * 0.016;

        if (g.mesh.position.y <= 0.2) {
          const flash = new THREE.PointLight(0xff4400, 10, 15); flash.position.copy(g.mesh.position); scene.add(flash);
          setTimeout(() => scene.remove(flash), 300);

          if (isBossAlive && bossMesh && bossMesh.position.distanceTo(g.mesh.position) < 12.0) {
            bossCurrentHP -= 250;
            if (bossCurrentHP <= 0) {
              scene.remove(bossMesh); isBossAlive = false;
              document.getElementById('boss-status').innerText = '🟢 已消滅';
            }
          }

          zombies.forEach((z) => {
            if (z.mesh.position.distanceTo(g.mesh.position) < 9.0) z.hp -= 250;
          });

          scene.remove(g.mesh); activeGrenades.splice(i, 1);
        }
      }

      if (isMobile) {
        const phi = THREE.MathUtils.degToRad(90 - lat); const theta = THREE.MathUtils.degToRad(lon);
        const target = new THREE.Vector3(); target.setFromSphericalCoords(1, phi, theta).add(camera.position); camera.lookAt(target);

        if (moveVector.x !== 0 || moveVector.y !== 0) {
          const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); forward.y = 0; forward.normalize();
          const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion); side.y = 0; side.normalize();
          camera.position.addScaledVector(forward, moveVector.y * 0.14); camera.position.addScaledVector(side, moveVector.x * 0.14);
        }
      } else if (controls && controls.isLocked) {
        const speed = 0.14;
        if (moveForward) controls.moveForward(speed); if (moveBackward) controls.moveForward(-speed);
        if (moveLeft) controls.moveRight(-speed); if (moveRight) controls.moveRight(speed);
      }

      const playerPos = camera.position;

      // 撿物資判定 (第 2 個物資觸發 BOSS)
      supplyBoxes.forEach(sb => {
        if (!sb.collected && playerPos.distanceTo(sb.mesh.position) < 2.2) {
          sb.collected = true; scene.remove(sb.mesh); collectedSupplies++;
          document.getElementById('supply-count').innerText = `${collectedSupplies} / ${totalSupplies}`;

          if (collectedSupplies === 2) spawnBossZombie();

          if (collectedSupplies >= totalSupplies) {
            isEvacReady = true;
            document.getElementById('evac-status').innerText = '🟢 已解鎖，前往大三巴！';
            document.getElementById('evac-status').style.color = '#10b981'; evacZone.material.color.setHex(0x10b981);
          }
        }
      });

      // 撤離判定
      if (isEvacReady && playerPos.distanceTo(evacZone.position) < 4.5) {
        alert('🚁 任務成功！你已安全撤離澳門！'); location.reload();
      }

      // BOSS AI 移動與攻擊
      if (isBossAlive && bossMesh) {
        const bPos = bossMesh.position;
        const dist = bPos.distanceTo(playerPos);
        if (dist > 2.5) {
          const dir = new THREE.Vector3().subVectors(playerPos, bPos); dir.y = 0; dir.normalize();
          bPos.addScaledVector(dir, 2.5 * zombieSpeedMultiplier * 0.016);
          bossMesh.lookAt(playerPos.x, 0, playerPos.z);
        } else {
          playerHP -= 0.8 * zombieDamageMultiplier;
          document.getElementById('hp-bar').style.width = Math.max(0, playerHP) + '%';
          if (playerHP <= 0) { alert('🧟‍♂️ 你被澳門喪屍王 BOSS 擊殺了！'); location.reload(); }
        }
      }

      // 普通喪屍 AI
      zombies.forEach(z => {
        const zPos = z.mesh.position; const dist = zPos.distanceTo(playerPos);
        if (dist > 1.2) {
          const dir = new THREE.Vector3().subVectors(playerPos, zPos); dir.y = 0; dir.normalize();
          zPos.addScaledVector(dir, z.speed * 0.016); z.mesh.lookAt(playerPos.x, 0.9, playerPos.z);
        } else {
          playerHP -= 0.25 * zombieDamageMultiplier;
          document.getElementById('hp-bar').style.width = Math.max(0, playerHP) + '%';
          if (playerHP <= 0) { alert('🧟‍♂️ 撤離失敗！你被喪屍圍攻了！'); location.reload(); }
        }
      });

      renderer.render(scene, camera);
    }

    function onKeyDown(e) {
      if (e.code === 'KeyW') moveForward = true; if (e.code === 'KeyS') moveBackward = true;
      if (e.code === 'KeyA') moveLeft = true; if (e.code === 'KeyD') moveRight = true;
      if (e.code === 'Digit1') { currentWeaponKey = 'rifle'; createGunMesh(); }
      if (e.code === 'Digit2') { currentWeaponKey = 'pistol'; createGunMesh(); }
      if (e.code === 'Digit3') { currentWeaponKey = 'grenade'; createGunMesh(); throwGrenade(); }
    }
    function onKeyUp(e) {
      if (e.code === 'KeyW') moveForward = false; if (e.code === 'KeyS') moveBackward = false;
      if (e.code === 'KeyA') moveLeft = false; if (e.code === 'KeyD') moveRight = false;
    }
  </script>
</body>
</html>
