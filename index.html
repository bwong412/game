<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>8x Telephoto 找不同 - Apple Cotai Strip Arcade</title>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-primary: #f5f5f7;
            --accent-blue: #2997ff;
            --apple-green: #30d158;
            --apple-red: #ff453a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
            color: var(--text-primary);
            user-select: none;
            -webkit-user-select: none;
        }

        /* 頂部 UI */
        #game-header {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(20px);
            padding: 12px 24px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .title-box h2 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent-blue);
        }

        .title-box p {
            margin: 2px 0 0 0;
            font-size: 0.85rem;
            color: #86868b;
        }

        .counter {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--apple-green);
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 找到了說明彈窗 */
        #info-toast {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(48, 209, 88, 0.2);
            border: 1px solid var(--apple-green);
            color: #fff;
            padding: 14px 28px;
            border-radius: 25px;
            backdrop-filter: blur(15px);
            font-size: 1rem;
            font-weight: 600;
            display: none;
            z-index: 30;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        /* 成功通關彈窗 */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(20px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal h1 {
            font-size: 2.8rem;
            color: var(--apple-green);
            margin-bottom: 10px;
        }

        .modal p {
            font-size: 1.1rem;
            color: #86868b;
            margin-bottom: 25px;
            max-width: 500px;
            line-height: 1.5;
        }

        .btn {
            background: var(--accent-blue);
            color: #fff;
            padding: 12px 32px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-btn">‹ 返回主頁</a>

    <div id="game-header">
        <div class="title-box">
            <h2>🔍 8x Telephoto 找不同</h2>
            <p>移動 8x 光學裁切鏡頭，找出 iPhone 18 Pro Max 與 Duo 嘅 5 個不同之處</p>
        </div>
        <div class="counter">已找出：<span id="found-count">0</span> / 5</div>
    </div>

    <div id="info-toast">已找到！</div>

    <canvas id="zoomCanvas"></canvas>

    <div id="victory-modal" class="modal">
        <h1>🎉 全數找出！</h1>
        <p>太強了！你透過 8x 超遠攝鏡頭完美掌握咗 iPhone 18 Pro Max 與 iPhone Duo 嘅所有硬體差異！</p>
        <button class="btn" onclick="location.reload()">再玩一次</button>
    </div>

    <script>
        const canvas = document.getElementById('zoomCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let foundCount = 0;

        // 5 個異同點區域數據 (基於資料圖)
        const diffs = [
            {
                id: 1,
                name: "長焦鏡頭：Pro Max 有獨立 48MP 8x 長焦；Duo 沒有獨立長焦鏡頭",
                xRatio: 0.3, yRatio: 0.35, radius: 45, found: false
            },
            {
                id: 2,
                name: "解鎖方式：Pro Max 使用 Face ID；Duo 使用側鍵 Touch ID",
                xRatio: 0.3, yRatio: 0.18, radius: 40, found: false
            },
            {
                id: 3,
                name: "機身形態：Pro Max 為 6.9 吋直板機；Duo 為 7.6 吋雙屏摺疊形態",
                xRatio: 0.72, yRatio: 0.5, radius: 70, found: false
            },
            {
                id: 4,
                name: "前置鏡頭：Pro Max 為 18MP Center Stage；Duo 內屏為 Under-display 螢幕下鏡頭",
                xRatio: 0.65, yRatio: 0.18, radius: 35, found: false
            },
            {
                id: 5,
                name: "觸控筆支援：Duo 支援 Apple Pencil (USB-C)；Pro Max 不支援",
                xRatio: 0.85, yRatio: 0.6, radius: 50, found: false
            }
        ];

        // 監聽滑鼠與觸控
        function updatePos(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.touches && e.touches[0]) {
                mouseX = e.touches[0].clientX - rect.left;
                mouseY = e.touches[0].clientY - rect.top;
            } else {
                mouseX = e.clientX - rect.left;
                mouseY = e.clientY - rect.top;
            }
        }

        window.addEventListener('mousemove', updatePos);
        window.addEventListener('touchmove', updatePos);
        window.addEventListener('click', checkClick);

        function checkClick(e) {
            diffs.forEach(d => {
                if (!d.found) {
                    const targetX = canvas.width * d.xRatio;
                    const targetY = canvas.height * d.yRatio;
                    const dist = Math.hypot(mouseX - targetX, mouseY - targetY);
                    
                    if (dist < d.radius + 30) {
                        d.found = true;
                        foundCount++;
                        document.getElementById('found-count').innerText = foundCount;
                        showToast(d.name);

                        if (foundCount === 5) {
                            setTimeout(() => {
                                document.getElementById('victory-modal').style.display = 'flex';
                            }, 1200);
                        }
                    }
                }
            });
        }

        function showToast(text) {
            const toast = document.getElementById('info-toast');
            toast.innerText = "✓ " + text;
            toast.style.display = "block";
            setTimeout(() => { toast.style.display = "none"; }, 3000);
        }

        // 繪製背景模型 (iPhone 18 Pro Max vs iPhone Duo)
        function drawDevices() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 背景深色底
            ctx.fillStyle = "#0a0a0c";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const w = canvas.width;
            const h = canvas.height;

            // ================= 1. 左側：iPhone 18 Pro Max (直板) =================
            const pX = w * 0.3;
            const pY = h * 0.5;
            const pWidth = 180;
            const pHeight = 360;

            ctx.save();
            ctx.translate(pX, pY);

            // 機身輪廓 (鈦金屬邊框)
            ctx.beginPath();
            ctx.roundRect(-pWidth/2, -pHeight/2, pWidth, pHeight, 32);
            ctx.fillStyle = "#1c1c1e";
            ctx.strokeStyle = "#48484a";
            ctx.lineWidth = 4;
            ctx.fill();
            ctx.stroke();

            // 螢幕 (Super Retina XDR 6.9")
            ctx.beginPath();
            ctx.roundRect(-pWidth/2 + 6, -pHeight/2 + 6, pWidth - 12, pHeight - 12, 28);
            ctx.fillStyle = "#000000";
            ctx.fill();

            // 頂部 Dynamic Island (Face ID)
            ctx.beginPath();
            ctx.roundRect(-25, -pHeight/2 + 18, 50, 14, 8);
            ctx.fillStyle = "#121212";
            ctx.fill();

            // 背面三鏡頭模組 (帶獨立 8x 48MP 長焦)
            ctx.beginPath();
            ctx.roundRect(-pWidth/2 + 15, -pHeight/2 + 40, 65, 75, 16);
            ctx.fillStyle = "rgba(255,255,255,0.05)";
            ctx.fill();

            // 3 個鏡頭
            ctx.beginPath();
            ctx.arc(-pWidth/2 + 32, -pHeight/2 + 58, 12, 0, Math.PI*2); // 主鏡
            ctx.arc(-pWidth/2 + 58, -pHeight/2 + 58, 12, 0, Math.PI*2); // 超廣角
            ctx.arc(-pWidth/2 + 32, -pHeight/2 + 90, 14, 0, Math.PI*2); // 48MP 獨立 8x 長焦!
            ctx.fillStyle = "#2c2c2e";
            ctx.strokeStyle = "#636366";
            ctx.lineWidth = 2;
            ctx.fill();
            ctx.stroke();

            // 標籤
            ctx.font = "bold 16px -apple-system, sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.fillText("iPhone 18 Pro Max", 0, pHeight/2 + 35);
            ctx.font = "12px sans-serif";
            ctx.fillStyle = "#86868b";
            ctx.fillText("6.9\" 直板 • Face ID • 8x 獨立長焦", 0, pHeight/2 + 55);

            ctx.restore();


            // ================= 2. 右側：iPhone Duo (摺疊雙屏) =================
            const dX = w * 0.72;
            const dY = h * 0.5;
            const dWidth = 300;
            const dHeight = 340;

            ctx.save();
            ctx.translate(dX, dY);

            // 雙屏摺疊機身 (Grade 5 鈦金屬)
            ctx.beginPath();
            ctx.roundRect(-dWidth/2, -dHeight/2, dWidth, dHeight, 20);
            ctx.fillStyle = "#2c2c2e";
            ctx.strokeStyle = "#545456";
            ctx.lineWidth = 4;
            ctx.fill();
            ctx.stroke();

            // 中間摺痕軸心 (Hinge)
            ctx.beginPath();
            ctx.moveTo(0, -dHeight/2);
            ctx.lineTo(0, dHeight/2);
            ctx.strokeStyle = "#1c1c1e";
            ctx.lineWidth = 6;
            ctx.stroke();

            // 左屏 (5.4") 與 右屏 (7.6" 打開總和)
            ctx.beginPath();
            ctx.roundRect(-dWidth/2 + 6, -dHeight/2 + 6, dWidth/2 - 9, dHeight - 12, 14);
            ctx.roundRect(3, -dHeight/2 + 6, dWidth/2 - 9, dHeight - 12, 14);
            ctx.fillStyle = "#050505";
            ctx.fill();

            // 側邊 Touch ID 解鎖鈕
            ctx.fillStyle = "#3a3a3c";
            ctx.fillRect(dWidth/2, -30, 5, 60);

            // 右內屏 Under-Display 螢幕下鏡頭 (隱形點)
            ctx.beginPath();
            ctx.arc(dWidth/4, -dHeight/2 + 25, 4, 0, Math.PI*2);
            ctx.fillStyle = "rgba(255,255,255,0.2)";
            ctx.fill();

            // 旁邊擺放 Apple Pencil (USB-C) 支援
            ctx.beginPath();
            ctx.roundRect(dWidth/2 + 25, -dHeight/2 + 30, 8, dHeight - 60, 4);
            ctx.fillStyle = "#e5e5ea";
            ctx.fill();

            // 標籤
            ctx.font = "bold 16px -apple-system, sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.fillText("iPhone Duo", 0, dHeight/2 + 35);
            ctx.font = "12px sans-serif";
            ctx.fillStyle = "#86868b";
            ctx.fillText("5.4\"+7.6\" 摺疊屏 • 側邊 Touch ID • 支援 Apple Pencil", 0, dHeight/2 + 55);

            ctx.restore();

            // 畫出已找到的綠色圈圈標記
            diffs.forEach(d => {
                if (d.found) {
                    const targetX = canvas.width * d.xRatio;
                    const targetY = canvas.height * d.yRatio;
                    ctx.beginPath();
                    ctx.arc(targetX, targetY, d.radius, 0, Math.PI * 2);
                    ctx.strokeStyle = "#30d158";
                    ctx.lineWidth = 4;
                    ctx.fillStyle = "rgba(48, 209, 88, 0.25)";
                    ctx.fill();
                    ctx.stroke();
                }
            });
        }

        // 繪製 8x 光學放大鏡
        function drawZoomLens() {
            const lensRadius = 90; // 放大鏡大小

            ctx.save();

            // 剪裁出圓形 8x 鏡頭區域
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, lensRadius, 0, Math.PI * 2);
            ctx.clip();

            // 喺放大鏡內部以 1.8 倍放大渲染局部畫面
            ctx.save();
            ctx.translate(mouseX, mouseY);
            ctx.scale(1.8, 1.8);
            ctx.translate(-mouseX, -mouseY);
            drawDevices();
            ctx.restore();

            ctx.restore();

            // 畫放大鏡金屬邊框與 8x 標誌
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, lensRadius, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(41, 151, 255, 0.9)";
            ctx.lineWidth = 5;
            ctx.stroke();

            // 十字準星線
            ctx.beginPath();
            ctx.moveTo(mouseX - 15, mouseY); ctx.lineTo(mouseX + 15, mouseY);
            ctx.moveTo(mouseX, mouseY - 15); ctx.lineTo(mouseX, mouseY + 15);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // 8x 標籤角標
            ctx.fillStyle = "#2997ff";
            ctx.beginPath();
            ctx.roundRect(mouseX + lensRadius - 35, mouseY + lensRadius - 25, 42, 20, 10);
            ctx.fill();
            ctx.font = "bold 11px sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.fillText("8x", mouseX + lensRadius - 14, mouseY + lensRadius - 11);
        }

        function gameLoop() {
            drawDevices();
            drawZoomLens();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
