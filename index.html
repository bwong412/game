<!DOCTYPE html>
<html lang="zh-Hant-MO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>澳門 GTA · 鏡海狂飆</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #canvas-container { width: 100vw; height: 100vh; }
  </style>
  <!-- 直接引入 Three.js (免 Terminal 安裝) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <script>
    // 1. 建立 3D 場景
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0c10); // 澳門夜空色

    // 2. 相機
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 10);

    // 3. 渲染器
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // 4. 澳門風格地面（深色石仔路感覺）
    const planeGeo = new THREE.PlaneGeometry(100, 100);
    const planeMat = new THREE.MeshBasicMaterial({ color: 0x22252a });
    const plane = new THREE.Mesh(planeGeo, planeMat);
    plane.rotation.x = -Math.PI / 2;
    scene.add(plane);

    // 5. 玩家角色（暫時用澳門黃色方塊代表）
    const playerGeo = new THREE.BoxGeometry(1, 2, 1);
    const playerMat = new THREE.MeshBasicMaterial({ color: 0xffc72c }); // 澳門黃
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.y = 1;
    scene.add(player);

    // 鍵盤操控
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.key] = true);
    window.addEventListener('keyup', (e) => keys[e.key] = false);

    // 遊戲循環
    function animate() {
      requestAnimationFrame(animate);

      // 移動邏輯
      if (keys['w'] || keys['W']) player.position.z -= 0.1;
      if (keys['s'] || keys['S']) player.position.z += 0.1;
      if (keys['a'] || keys['A']) player.position.x -= 0.1;
      if (keys['d'] || keys['D']) player.position.x += 0.1;

      // 相機跟隨
      camera.position.x = player.position.x;
      camera.position.z = player.position.z + 8;
      camera.lookAt(player.position);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
