<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CSO Macau: Ruined City Apocalypse</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #050811; touch-action: none; }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 12px; height: 12px; border: 2px solid #00ffcc;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
      border-radius: 50%; box-shadow: 0 0 8px #00ffcc;
    }
    #ui {
      position: absolute; bottom: 15px; left: 15px;
      color: #fff; font-size: 14px; text-shadow: 2px 2px 4px #000; z-index: 10;
      background: rgba(15, 23, 42, 0.85); padding: 12px 18px; border-radius: 10px;
      border: 1px solid rgba(56, 189, 248, 0.3); backdrop-filter: blur(4px);
    }
    #hp-bar-container {
      width: 160px; height: 14px; background: #1e293b; border: 1px solid #38bdf8; margin-top: 4px; border-radius: 7px; overflow: hidden;
    }
    #hp-bar { width: 100%; height: 100%; background: linear-gradient(90deg, #ef4444, #f87171); transition: width 0.2s; }
    
    #mission-tracker {
      position: absolute; top: 15px; right: 15px;
      background: rgba(15, 23, 42, 0.9); color: #fbbf24;
      padding: 12px 16px; border-radius: 10px; z-index: 10;
      border: 1px solid #fbbf24; font-size: 13px; font-weight: bold;
      box-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
    }

    /* 手機控制介面 */
    #mobile-controls {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 12; pointer-events: none;
    }
    #joystick-zone {
      position: absolute; bottom: 25px; left: 25px; width: 120px; height: 120px; pointer-events: auto;
    }
    #shoot-btn {
      position: absolute; bottom: 35px; right: 35px; width: 75px; height: 75px;
      background: radial-gradient(circle, #ef4444 0%, #991b1b 100%); border: 2px solid #fff; border-radius: 50%;
      color: white; font-weight: bold; font-size: 16px; pointer-events: auto;
      display: flex; justify-content: center; align-items: center; box-shadow: 0 0 15px rgba(239, 68, 68, 0.6);
    }
    #switch-btn {
      position: absolute; bottom: 125px; right: 40px; width: 50px; height: 50px;
      background: rgba(56, 189, 248, 0.85); border: 1px solid #fff; border-radius: 50%;
      color: white; font-size: 12px; pointer-events: auto; font-weight: bold;
      display: flex; justify-content: center; align-items: center;
    }
    #bomb-btn {
      position: absolute; bottom: 125px; right: 100px; width: 50px; height: 50px;
      background: rgba(245, 158, 11, 0.9); border: 1px solid #fff; border-radius: 50%;
      color: white; font-size: 12px; pointer-events: auto; font-weight: bold;
      display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
    }

    #menu-panel {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.95); color: white;
      padding: 24px; border-radius: 16px; z-index: 20; width: 85%; max-width: 360px;
      border: 1px solid #fbbf24; text-align: center; box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    #menu-panel button {
      padding: 12px; font-size: 16px; margin-top: 14px; cursor: pointer;
      background: linear-gradient(135deg, #d97706, #b45309); color: white; border: none; border-radius: 8px; font-weight: bold; width: 100%;
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>

  <div id="crosshair"></div>

  <div id="mission-tracker">
    🎯 任務：【澳門撤離行動】<br>
    📦 搜刮物資：<span id="supply-count" style="color:#fff;">0 / 3</span><br>
    💣 剩餘炸彈：<span id="grenade-count" style="color:#fbbf24;">3</span> 個 (按 3 投擲)<br>
    🚁 大三巴撤離點：<span id="evac-status" style="color:#ef4444;">未解鎖</span>
  </div>

  <div id="mobile-controls">
    <div id="joystick-zone"></div>
    <div id="shoot-btn">開槍</div>
    <div id="switch-btn">換槍</div>
    <div id="bomb-btn">💣 炸彈</div>
  </div>

  <div id="menu-panel">
    <h3 style="margin: 0; color: #fbbf24; font-size: 22px;">🇲🇴 澳門生存戰：末日突圍</h3>
    <p style="font-size: 12px; color: #cbd5e1; margin-top: 8px; line-height: 1.5;">
      地標：細節大三巴、永利皇宮纜車、唐樓街區、廢棄汽車<br>
      武器：AK-47、Glock 手槍與 💣 高爆手榴彈 (按 1/2/3 切換)
    </p>
    <button id="start-btn">進入戰場</button>
  </div>

  <div id="ui">
    <div>血量 HP: <div id="hp-bar-container"><div id="hp-bar"></div></div></div>
    <div style="margin-top:6px;">擊殺: <span id="kills" style="color:#fbbf24;">0</span> | <span id="weapon-name">AK-47</span></div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let isMobile = false;
    let killCount = 0, playerHP = 100;
    let collectedSupplies = 0, totalSupplies = 3, isEvacReady = false;
    let grenadeCount = 3;

    const collidableObjects = [], zombies = [], supplyBoxes = [], activeGrenades = [];
    let evacZone = null, gunMesh;

    let moveVector = { x: 0, y: 0 };
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let touchStartX = 0, touchStartY = 0;
    let lon = 0, lat = 0;

    const weapons = {
      rifle: { name: 'AK-47 步槍', color: 0x8B4513, length: 0.9, damage: 45 },
      pistol: { name: 'Glock 18 手槍', color: 0x222222, length: 0.4, damage: 25 },
      grenade: { name: '💣 高爆手榴彈', color: 0x15803d, length: 0.2, damage: 200 }
    };
    let currentWeaponKey = 'rifle';

    if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
      isMobile = true;
    }

    init3D();
    if (isMobile) initMobileUI();
    animate();

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x060913);
      scene.fog = new THREE.FogExp2(0x060913, 0.012);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

      const ambientLight = new THREE.AmbientLight(0xddeeff, 0.5);
      scene.add(ambientLight);

      const casinoLight = new THREE.DirectionalLight(0xfbbf24, 1.2);
      casinoLight.position.set(60, 90, 40);
      scene.add(casinoLight);

      // 馬路與街頭
      createRoadSystem();

      // 超細節地標 & 澳門唐樓
      createDetailedRuinsOfStPaul();
      createDetailedWynnPalace();
      createAppleStore();
      createPataneMarket();
      createMacauTongLauAndSkyscrapers();
      createAbandonedCars();

      camera.position.set(0, 1.6, 20);
      if (!isMobile) {
        controls = new THREE.PointerLockControls(camera, document.body);
        scene.add(controls.getObject());
      }

      createGunMesh();

      document.getElementById('start-btn').addEventListener('click', startGame);

      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      document.addEventListener('mousedown', (e) => {
        if(!isMobile && controls && controls.isLocked) {
          if (currentWeaponKey === 'grenade') throwGrenade();
          else onShoot();
        }
      });

      if (isMobile) {
        document.addEventListener('touchstart', (e) => {
          if (e.touches[0].clientX > window.innerWidth / 2) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
          }
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
          for (let touch of e.touches) {
            if (touch.clientX > window.innerWidth / 2) {
              const deltaX = touch.clientX - touchStartX;
              const deltaY = touch.clientY - touchStartY;
              lon -= deltaX * 0.25;
              lat -= deltaY * 0.25;
              lat = Math.max(-85, Math.min(85, lat));
              touchStartX = touch.clientX;
              touchStartY = touch.clientY;
            }
          }
        }, { passive: false });
      }

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.body.appendChild(renderer.domElement);
    }

    // --- 🛣️ 馬路與斑馬線 ---
    function createRoadSystem() {
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(320, 320), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 }));
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      const roadMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.9 });
      
      const mainRoadNS = new THREE.Mesh(new THREE.PlaneGeometry(18, 280), roadMat);
      mainRoadNS.rotation.x = -Math.PI / 2; mainRoadNS.position.y = 0.02; scene.add(mainRoadNS);

      const mainRoadEW = new THREE.Mesh(new THREE.PlaneGeometry(280, 18), roadMat);
      mainRoadEW.rotation.x = -Math.PI / 2; mainRoadEW.position.y = 0.02; scene.add(mainRoadEW);

      const yellowLineMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24 });
      const line1 = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 280), yellowLineMat);
      line1.rotation.x = -Math.PI / 2; line1.position.set(0, 0.03, 0); scene.add(line1);

      const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      for (let i = -7; i <= 7; i += 1.5) {
        const zebra1 = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 4), whiteMat);
        zebra1.rotation.x = -Math.PI / 2; zebra1.position.set(i, 0.04, 14); scene.add(zebra1);
        const zebra2 = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 4), whiteMat);
        zebra2.rotation.x = -Math.PI / 2; zebra2.position.set(i, 0.04, -14); scene.add(zebra2);
      }
    }

    // --- 🏛️ 超細節大三巴牌坊 (Ruins of St. Paul's Detail) ---
    function createDetailedRuinsOfStPaul() {
      const group = new THREE.Group();
      const stoneMat = new THREE.MeshStandardMaterial({ color: 0xc8c8cf, roughness: 0.6 });
      const darkStoneMat = new THREE.MeshStandardMaterial({ color: 0x71717a, roughness: 0.8 });

      // 石階梯
      for (let i = 0; i < 8; i++) {
        const stair = new THREE.Mesh(new THREE.BoxGeometry(28 - i*0.8, 0.4, 1.8), stoneMat);
        stair.position.set(0, i * 0.4, 10 - i * 1.6);
        group.add(stair);
      }

      // 底層牌坊 (拱門與雕花石柱)
      const base = new THREE.Mesh(new THREE.BoxGeometry(24, 6.5, 2.8), stoneMat);
      base.position.set(0, 6, 0);
      group.add(base);

      // 三層拱門
      for(let x of [-7, 0, 7]) {
        const arch = new THREE.Mesh(new THREE.BoxGeometry(3.5, 4.5, 2.9), new THREE.MeshBasicMaterial({ color: 0x000000 }));
        arch.position.set(x, 5.2, 0);
        group.add(arch);

        // 石柱裝飾
        const col1 = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 6.5, 12), darkStoneMat);
        col1.position.set(x - 2.2, 6, 1.5);
        const col2 = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 6.5, 12), darkStoneMat);
        col2.position.set(x + 2.2, 6, 1.5);
        group.add(col1, col2);
      }

      // 第二層 (雕像壁龕)
      const layer2 = new THREE.Mesh(new THREE.BoxGeometry(19, 5.5, 2.4), stoneMat);
      layer2.position.set(0, 12, 0);
      group.add(layer2);

      // 第三層與頂部
      const layer3 = new THREE.Mesh(new THREE.BoxGeometry(13, 4.5, 2.0), stoneMat);
      layer3.position.set(0, 17, 0);
      group.add(layer3);

      // 鍍金十字架
      const cross = new THREE.Mesh(new THREE.BoxGeometry(0.8, 3.5, 0.4), new THREE.MeshBasicMaterial({ color: 0xfbbf24 }));
      cross.position.set(0, 21, 0);
      group.add(cross);

      group.position.set(0, 0, -85);
      scene.add(group);
      collidableObjects.push(base, layer2);

      // 撤離點
      const evacGeo = new THREE.CylinderGeometry(4.5, 4.5, 0.2, 32);
      evacZone = new THREE.Mesh(evacGeo, new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.5 }));
      evacZone.position.set(0, 0.1, -68);
      scene.add(evacZone);
    }

    // --- 👑 超細節永利皇宮 (Wynn Palace Detail & Cable Car) ---
    function createDetailedWynnPalace() {
      const group = new THREE.Group();
      
      // 弧形金色酒店大樓
      const goldMat = new THREE.MeshStandardMaterial({ color: 0xeab308, metalness: 0.85, roughness: 0.15 });
      const hotel = new THREE.Mesh(new THREE.BoxGeometry(46, 32, 16), goldMat);
      hotel.position.y = 16;
      group.add(hotel);

      // 發光 WYNN 招牌框
      const sign = new THREE.Mesh(new THREE.BoxGeometry(16, 4, 1), new THREE.MeshBasicMaterial({ color: 0xffea88 }));
      sign.position.set(0, 28, 8.2);
      group.add(sign);

      // 表演湖水池 (Performance Lake)
      const poolMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.1, transparent: true, opacity: 0.85 });
      const pool = new THREE.Mesh(new THREE.CylinderGeometry(20, 20, 0.6, 32), poolMat);
      pool.position.set(0, 0.3, 28);
      group.add(pool);

      // 環湖觀光纜車纜繩與車廂 (Cable Cars)
      const cableMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
      const line = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 50), cableMat);
      line.rotation.z = Math.PI / 2; line.position.set(0, 18, 28);
      group.add(line);

      for(let x of [-15, 0, 15]) {
        const car = new THREE.Mesh(new THREE.BoxGeometry(2, 2.2, 2), new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.5 }));
        car.position.set(x, 17, 28);
        group.add(car);
      }

      group.position.set(-85, 0, -35);
      scene.add(group);
      collidableObjects.push(hotel);
    }

    // --- 🏢 澳門舊式唐樓與摩天大樓 ---
    function createMacauTongLauAndSkyscrapers() {
      // 唐樓 (綠色/鵝黃色葡式舊樓，帶鐵閘窗花結構)
      const tongLauConfigs = [
        {x: -35, z: -15, h: 14, color: 0x86efac},
        {x: 35, z: -15, h: 16, color: 0xfef08a},
        {x: -35, z: 25, h: 12, color: 0x93c5fd}
      ];

      tongLauConfigs.forEach(c => {
        const group = new THREE.Group();
        const wallMat = new THREE.MeshStandardMaterial({ color: c.color, roughness: 0.7 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(16, c.h, 16), wallMat);
        body.position.y = c.h / 2;
        group.add(body);

        // 窗花與綠色雨蓬 (Canopy)
        const windowGeo = new THREE.PlaneGeometry(1.2, 1.5);
        const winMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });
        for(let y = 3; y < c.h - 2; y += 3.5) {
          for(let x = -5; x <= 5; x += 3.5) {
            const win = new THREE.Mesh(windowGeo, winMat);
            win.position.set(x, y, 8.05);
            group.add(win);
          }
        }

        group.position.set(c.x, 0, c.z);
        scene.add(group);
        collidableObjects.push(body);
      });

      // 遠方高樓大廈
      const sky1 = new THREE.Mesh(new THREE.BoxGeometry(20, 50, 20), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
      sky1.position.set(65, 25, -70); scene.add(sky1); collidableObjects.push(sky1);
    }

    // --- 🚗 末日廢棄汽車掩體 ---
    function createAbandonedCars() {
      const carCoords = [
        {x: -6, z: 8, ry: 0.3},
        {x: 8, z: -20, ry: -0.8},
        {x: -12, z: -40, ry: 1.2}
      ];

      carCoords.forEach(c => {
        const carGroup = new THREE.Group();
        const carMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.6, roughness: 0.5 });
        
        // 車身
        const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.0, 4.5), carMat);
        body.position.y = 0.6; carGroup.add(body);

        // 車頂
        const roof = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.8, 2.4), carMat);
        roof.position.set(0, 1.4, -0.2); carGroup.add(roof);

        // 車輪
        const wheelMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        for(let wx of [-1.1, 1.1]) {
          for(let wz of [-1.3, 1.3]) {
            const w = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.3, 12), wheelMat);
            w.rotation.z = Math.PI / 2; w.position.set(wx, 0.4, wz);
            carGroup.add(w);
          }
        }

        carGroup.position.set(c.x, 0, c.z);
        carGroup.rotation.y = c.ry;
        scene.add(carGroup);
        collidableObjects.push(body);
      });
    }

    function createAppleStore() {
      const cube = new THREE.Mesh(new THREE.BoxGeometry(14, 10, 14), new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.4, roughness: 0.1 }));
      cube.position.set(-55, 5, 45); scene.add(cube); collidableObjects.push(cube);
    }

    function createPataneMarket() {
      const market = new THREE.Mesh(new THREE.BoxGeometry(28, 15, 20), new THREE.MeshStandardMaterial({ color: 0x334155 }));
      market.position.set(55, 7.5, 45); scene.add(market); collidableObjects.push(market);
    }

    // --- 💣 投擲手榴彈邏輯 ---
    function throwGrenade() {
      if (grenadeCount <= 0) return alert('💣 手榴彈用完了！');

      grenadeCount--;
      document.getElementById('grenade-count').innerText = grenadeCount;

      const grenade = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 12), new THREE.MeshStandardMaterial({ color: 0x15803d }));
      const startPos = camera.position.clone();
      grenade.position.copy(startPos);

      // 計算拋射方向 (弧線拋物線)
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      const velocity = dir.multiplyScalar(18);
      velocity.y += 6; // 向上弧線

      scene.add(grenade);
      activeGrenades.push({ mesh: grenade, vel: velocity, timer: 0 });
    }

    function spawnZombie() {
      const zombieGroup = new THREE.Group();
      const skinMat = new THREE.MeshStandardMaterial({ color: 0x224422 });
      const clothMat = new THREE.MeshStandardMaterial({ color: 0x0f172a });

      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.75, 1.15, 0.4), clothMat); torso.position.y = 1.15; zombieGroup.add(torso);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.48, 0.48), skinMat); head.position.y = 1.9; zombieGroup.add(head);

      const eyeGeo = new THREE.SphereGeometry(0.06); const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const e1 = new THREE.Mesh(eyeGeo, eyeMat); e1.position.set(-0.12, 1.95, 0.25);
      const e2 = new THREE.Mesh(eyeGeo, eyeMat); e2.position.set(0.12, 1.95, 0.25);
      zombieGroup.add(e1, e2);

      const armGeo = new THREE.BoxGeometry(0.2, 0.8, 0.2);
      const armL = new THREE.Mesh(armGeo, skinMat); armL.position.set(-0.48, 1.35, 0.38); armL.rotation.x = -Math.PI / 2.3;
      const armR = new THREE.Mesh(armGeo, skinMat); armR.position.set(0.48, 1.35, 0.38); armR.rotation.x = -Math.PI / 2.3;
      zombieGroup.add(armL, armR);

      const angle = Math.random() * Math.PI * 2;
      const dist = 30 + Math.random() * 25;
      zombieGroup.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);

      scene.add(zombieGroup);
      zombies.push({ mesh: zombieGroup, hp: 100, speed: 3.2 });
    }

    function initMobileUI() {
      document.getElementById('mobile-controls').style.display = 'block';

      const manager = nipplejs.create({
        zone: document.getElementById('joystick-zone'),
        mode: 'static',
        position: { left: '60px', bottom: '60px' },
        color: 'white'
      });

      manager.on('move', (evt, data) => { if (data.vector) { moveVector.x = data.vector.x; moveVector.y = data.vector.y; } });
      manager.on('end', () => { moveVector.x = 0; moveVector.y = 0; });

      document.getElementById('shoot-btn').addEventListener('touchstart', (e) => { e.preventDefault(); onShoot(); });
      document.getElementById('switch-btn').addEventListener('touchstart', (e) => {
        e.preventDefault();
        currentWeaponKey = currentWeaponKey === 'rifle' ? 'pistol' : 'rifle';
        createGunMesh();
      });
      document.getElementById('bomb-btn').addEventListener('touchstart', (e) => {
        e.preventDefault();
        currentWeaponKey = 'grenade';
        throwGrenade();
      });
    }

    function spawnSupplyBoxes() {
      [{x:-20,z:-20}, {x:35,z:20}, {x:-30,z:30}].forEach(c => {
        const box = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), new THREE.MeshStandardMaterial({ color: 0xfbbf24 }));
        box.position.set(c.x, 0.7, c.z);
        scene.add(box);
        supplyBoxes.push({ mesh: box, collected: false });
      });
    }

    function startGame() {
      document.getElementById('menu-panel').style.display = 'none';
      spawnSupplyBoxes();
      for(let i = 0; i < 6; i++) spawnZombie();
      if (!isMobile) controls.lock();
    }

    function createGunMesh() {
      if (gunMesh) camera.remove(gunMesh);
      const w = weapons[currentWeaponKey];
      gunMesh = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, w.length), new THREE.MeshStandardMaterial({ color: w.color }));
      gunMesh.position.set(0.2, -0.2, -0.4);
      camera.add(gunMesh);
      document.getElementById('weapon-name').innerText = w.name;
    }

    function onShoot() {
      gunMesh.position.z += 0.06;
      setTimeout(() => gunMesh.position.z -= 0.06, 50);

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        if (raycaster.intersectObjects(z.mesh.children).length > 0) {
          z.hp -= weapons[currentWeaponKey].damage;
          const dir = new THREE.Vector3().subVectors(z.mesh.position, camera.position).normalize();
          z.mesh.position.addScaledVector(dir, 1.0);

          if (z.hp <= 0) {
            scene.remove(z.mesh);
            zombies.splice(i, 1);
            killCount++;
            document.getElementById('kills').innerText = killCount;
            setTimeout(spawnZombie, 1200);
          }
          break;
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);

      // 手榴彈物理軌跡與爆炸判定
      for(let i = activeGrenades.length - 1; i >= 0; i--) {
        const g = activeGrenades[i];
        g.mesh.position.addScaledVector(g.vel, 0.016);
        g.vel.y -= 9.8 * 0.016; // 重力

        if (g.mesh.position.y <= 0.2) {
          // 落地爆炸效果 (Explosion)
          const flash = new THREE.PointLight(0xff4400, 10, 15);
          flash.position.copy(g.mesh.position);
          scene.add(flash);
          setTimeout(() => scene.remove(flash), 300);

          // 範圍毀滅傷害 (AOE Damage)
          zombies.forEach((z, zIdx) => {
            if (z.mesh.position.distanceTo(g.mesh.position) < 8.0) {
              z.hp -= 200;
              if (z.hp <= 0) {
                scene.remove(z.mesh);
                killCount++;
                document.getElementById('kills').innerText = killCount;
                setTimeout(spawnZombie, 1000);
              }
            }
          });

          scene.remove(g.mesh);
          activeGrenades.splice(i, 1);
        }
      }

      if (isMobile) {
        const phi = THREE.MathUtils.degToRad(90 - lat);
        const theta = THREE.MathUtils.degToRad(lon);
        const target = new THREE.Vector3();
        target.setFromSphericalCoords(1, phi, theta).add(camera.position);
        camera.lookAt(target);

        if (moveVector.x !== 0 || moveVector.y !== 0) {
          const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion); forward.y = 0; forward.normalize();
          const side = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion); side.y = 0; side.normalize();
          camera.position.addScaledVector(forward, moveVector.y * 0.14);
          camera.position.addScaledVector(side, moveVector.x * 0.14);
        }
      } else if (controls && controls.isLocked) {
        const speed = 0.14;
        if (moveForward) controls.moveForward(speed);
        if (moveBackward) controls.moveForward(-speed);
        if (moveLeft) controls.moveRight(-speed);
        if (moveRight) controls.moveRight(speed);
      }

      const playerPos = camera.position;

      // 物資箱
      supplyBoxes.forEach(sb => {
        if (!sb.collected && playerPos.distanceTo(sb.mesh.position) < 2.2) {
          sb.collected = true;
          scene.remove(sb.mesh);
          collectedSupplies++;
          document.getElementById('supply-count').innerText = `${collectedSupplies} / ${totalSupplies}`;
          if (collectedSupplies >= totalSupplies) {
            isEvacReady = true;
            document.getElementById('evac-status').innerText = '🟢 已解鎖，前往大三巴！';
            document.getElementById('evac-status').style.color = '#10b981';
            evacZone.material.color.setHex(0x10b981);
          }
        }
      });

      // 撤離判定
      if (isEvacReady && playerPos.distanceTo(evacZone.position) < 4.5) {
        alert('🚁 任務成功！你已安全撤離澳門！');
        location.reload();
      }

      // 喪屍 AI
      zombies.forEach(z => {
        const zPos = z.mesh.position;
        const dist = zPos.distanceTo(playerPos);
        if (dist > 1.2) {
          const dir = new THREE.Vector3().subVectors(playerPos, zPos); dir.y = 0; dir.normalize();
          zPos.addScaledVector(dir, z.speed * 0.016);
          z.mesh.lookAt(playerPos.x, 0.9, playerPos.z);
        } else {
          playerHP -= 0.25;
          document.getElementById('hp-bar').style.width = Math.max(0, playerHP) + '%';
          if (playerHP <= 0) {
            alert('🧟‍♂️ 撤離失敗！你被喪屍圍攻了！');
            location.reload();
          }
        }
      });

      renderer.render(scene, camera);
    }

    function onKeyDown(e) {
      if (e.code === 'KeyW') moveForward = true;
      if (e.code === 'KeyS') moveBackward = true;
      if (e.code === 'KeyA') moveLeft = true;
      if (e.code === 'KeyD') moveRight = true;
      if (e.code === 'Digit1') { currentWeaponKey = 'rifle'; createGunMesh(); }
      if (e.code === 'Digit2') { currentWeaponKey = 'pistol'; createGunMesh(); }
      if (e.code === 'Digit3') { currentWeaponKey = 'grenade'; createGunMesh(); throwGrenade(); }
    }
    function onKeyUp(e) {
      if (e.code === 'KeyW') moveForward = false;
      if (e.code === 'KeyS') moveBackward = false;
      if (e.code === 'KeyA') moveLeft = false;
      if (e.code === 'KeyD') moveRight = false;
    }
  </script>
</body>
</html>
