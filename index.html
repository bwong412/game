<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁版 Minecraft - 蓋澳門旅遊塔 & 匯出 GLB</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            margin-top: -5px;
            margin-left: -5px;
            pointer-events: none;
            color: white;
            font-size: 24px;
            line-height: 10px;
            text-align: center;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            max-width: 280px;
        }
        .btn-group {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }
        button {
            padding: 6px 10px;
            font-size: 12px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #2196F3;
            color: white;
            font-weight: bold;
        }
        button:hover { background: #0b7dda; }
        .export-btn { background: #4CAF50; }
        .export-btn:hover { background: #45a049; }
        .reset-btn { background: #f44336; }
        .reset-btn:hover { background: #da190b; }

        #hotbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px;
            border-radius: 8px;
        }
        .slot {
            width: 40px;
            height: 40px;
            border: 2px solid #aaa;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }
        .slot.active {
            border-color: #ffeb3b;
            box-shadow: 0 0 8px #ffeb3b;
        }
    </style>

    <!-- 載入 Three.js 與 GLTFExporter 擴充元件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
</head>
<body>

    <div id="crosshair">+</div>
    
    <div id="ui">
        <b>🎮 控制說明：</b><br>
        ・<b>點擊畫面</b>：鎖定視角（按 Esc 退出）<br>
        ・<b>WASD / 方向鍵</b>：前後左右移動<br>
        ・<b>空白鍵 (Space)</b>：向上飛行 / <b>Shift</b>：向下飛行<br>
        ・<b>滑鼠左鍵</b>：破壞方塊<br>
        ・<b>滑鼠右鍵</b>：放置方塊<br>
        ・<b>數字鍵 1 - 5</b>：切換方塊種類<br>

        <div class="btn-group">
            <button id="save-btn">儲存存檔</button>
            <button id="load-btn">讀取存檔</button>
            <button id="export-btn" class="export-btn">匯出 GLB 模型</button>
            <button id="reset-btn" class="reset-btn">清空地圖</button>
        </div>
    </div>

    <!-- 下方快捷欄 (Hotbar) -->
    <div id="hotbar">
        <div class="slot active" style="background: #55aa55;">1<br>草地</div>
        <div class="slot" style="background: #8b5a2b;">2<br>木頭</div>
        <div class="slot" style="background: #b22222;">3<br>紅磚</div>
        <div class="slot" style="background: #888888;">4<br>石材</div>
        <div class="slot" style="background: rgba(173, 216, 230, 0.7);">5<br>玻璃</div>
    </div>

    <script>
        // 1. 基本設定 (Scene, Camera, Renderer)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // 天空藍

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 光源
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(30, 60, 30);
        scene.add(dirLight);

        // 2. 方塊幾何體與材質設定 (定義 5 種不同方塊)
        const geometry = new THREE.BoxGeometry(1, 1, 1);
        const materials = [
            new THREE.MeshLambertMaterial({ color: 0x55aa55 }), // 1: 草地 (綠)
            new THREE.MeshLambertMaterial({ color: 0x8b5a2b }), // 2: 木頭 (棕)
            new THREE.MeshLambertMaterial({ color: 0xb22222 }), // 3: 紅磚 (紅)
            new THREE.MeshLambertMaterial({ color: 0x888888 }), // 4: 石材 (灰)
            new THREE.MeshLambertMaterial({ color: 0xadd8e6, transparent: true, opacity: 0.6 }) // 5: 玻璃 (半透明藍)
        ];

        let selectedBlockType = 0; // 預設選擇草地
        let blocks = [];

        // 3. 生成初始地面
        function createInitialWorld() {
            clearWorld();
            for (let x = -8; x <= 8; x++) {
                for (let z = -8; z <= 8; z++) {
                    addBlock(x, 0, z, 0); // 用草地鋪平
                }
            }
        }

        function addBlock(x, y, z, typeIndex) {
            const cube = new THREE.Mesh(geometry, materials[typeIndex]);
            cube.position.set(x, y, z);
            cube.userData = { type: typeIndex }; // 記錄方塊類型
            scene.add(cube);
            blocks.push(cube);
        }

        function clearWorld() {
            blocks.forEach(b => scene.remove(b));
            blocks = [];
        }

        // 4. 快捷欄 (Hotbar) 切換邏輯
        const slots = document.querySelectorAll('.slot');
        function selectSlot(index) {
            selectedBlockType = index;
            slots.forEach((slot, i) => {
                slot.classList.toggle('active', i === index);
            });
        }

        document.addEventListener('keydown', (e) => {
            if (['1', '2', '3', '4', '5'].includes(e.key)) {
                selectSlot(parseInt(e.key) - 1);
            }
        });

        // 5. 存檔 / 讀取 / 匯出 GLB 功能
        document.getElementById('save-btn').addEventListener('click', () => {
            const worldData = blocks.map(b => ({
                x: b.position.x,
                y: b.position.y,
                z: b.position.z,
                type: b.userData.type
            }));
            localStorage.setItem('macau_tower_save', JSON.stringify(worldData));
            alert('成功儲存建築紀錄！');
        });

        document.getElementById('load-btn').addEventListener('click', () => {
            const savedData = localStorage.getItem('macau_tower_save');
            if (savedData) {
                clearWorld();
                const worldData = JSON.parse(savedData);
                worldData.forEach(b => addBlock(b.x, b.y, b.z, b.type));
                alert('已成功載入你的建築！');
            } else {
                alert('找不到存檔紀錄。');
            }
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            if (confirm('確定要清空所有方塊嗎？')) {
                createInitialWorld();
            }
        });

        // 🌟 關鍵功能：匯出成 GLB 3D 模型檔
        document.getElementById('export-btn').addEventListener('click', () => {
            if (blocks.length === 0) {
                alert('場景中沒有方塊可匯出！');
                return;
            }

            const exporter = new THREE.GLTFExporter();
            // 創建一個臨時 Group 包含所有方塊以進行導出
            const exportGroup = new THREE.Group();
            blocks.forEach(b => exportGroup.add(b.clone()));

            exporter.parse(
                exportGroup,
                function (gltf) {
                    const blob = new Blob([gltf], { type: 'application/octet-stream' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'macau_tower.glb'; // 導出的檔案名稱
                    link.click();
                    alert('GLB 模型匯出成功！您可以將 macau_tower.glb 放進 GitHub Repository 了。');
                },
                { binary: true } // 導出為 .glb 二進制格式
            );
        });

        // 6. 移動與第一人稱視角控制
        camera.position.set(0, 5, 12);

        let isLocked = false;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, moveUp = false, moveDown = false;

        document.body.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === document.body;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isLocked) return;
            camera.rotation.y -= e.movementX * 0.002;
            camera.rotation.x -= e.movementY * 0.002;
            camera.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, camera.rotation.x));
        });

        document.addEventListener('keydown', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': moveUp = true; break;
                case 'ShiftLeft': moveDown = true; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
                case 'Space': moveUp = false; break;
                case 'ShiftLeft': moveDown = false; break;
            }
        });

        // 7. 放置與破壞方塊 (Raycaster)
        const raycaster = new THREE.Raycaster();

        window.addEventListener('mousedown', (e) => {
            if (!isLocked) return;

            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(blocks);

            if (intersects.length > 0) {
                const intersect = intersects[0];

                if (e.button === 0) {
                    // 左鍵：破壞方塊
                    scene.remove(intersect.object);
                    blocks = blocks.filter(b => b !== intersect.object);
                } else if (e.button === 2) {
                    // 右鍵：放置方塊
                    const normal = intersect.face.normal;
                    const newPos = intersect.object.position.clone().add(normal);
                    addBlock(newPos.x, newPos.y, newPos.z, selectedBlockType);
                }
            }
        });

        window.addEventListener('contextmenu', e => e.preventDefault());

        // 初始化世界
        createInitialWorld();

        // 8. 動畫渲染迴圈
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (isLocked) {
                const speed = 12 * delta;

                // 前後左右移動
                const dirZ = Number(moveForward) - Number(moveBackward);
                const dirX = Number(moveRight) - Number(moveLeft);

                if (moveForward || moveBackward) camera.translateZ(-dirZ * speed);
                if (moveLeft || moveRight) camera.translateX(dirX * speed);

                // 上下飛行 (方便蓋高塔如澳門旅遊塔)
                if (moveUp) camera.position.y += speed;
                if (moveDown) camera.position.y -= speed;
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        animate();

        // 視窗 Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
