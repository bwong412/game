<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>CSO Macau - Mission: Ruins of St. Paul's</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #000; }
    #crosshair {
      position: absolute; top: 50%; left: 50%;
      width: 10px; height: 10px; border: 2px solid #00ffcc;
      transform: translate(-50%, -50%); pointer-events: none; z-index: 10;
      border-radius: 50%;
    }
    #ui {
      position: absolute; bottom: 20px; left: 20px;
      color: #fff; font-size: 18px; text-shadow: 2px 2px 5px #000; z-index: 10;
      background: rgba(15, 23, 42, 0.85); padding: 15px 20px; border-radius: 10px;
      border: 1px solid #38bdf844;
    }
    #hp-bar-container {
      width: 200px; height: 14px; background: #1e293b; border: 1px solid #38bdf8; margin-top: 5px; border-radius: 7px; overflow: hidden;
    }
    #hp-bar { width: 100%; height: 100%; background: #ef4444; transition: width 0.2s; }
    
    #mission-tracker {
      position: absolute; top: 20px; right: 20px;
      background: rgba(15, 23, 42, 0.9); color: #f59e0b;
      padding: 15px 20px; border-radius: 10px; z-index: 10;
      border: 2px solid #f59e0b; font-weight: bold;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
    }

    #menu-panel {
      position: absolute; top: 20px; left: 20px;
      background: rgba(15, 23, 42, 0.95); color: white;
      padding: 20px; border-radius: 12px; z-index: 20; max-width: 320px;
      border: 1px solid #f59e0b; box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
    }
    #menu-panel button {
      padding: 10px 14px; font-size: 15px; margin-top: 10px; cursor: pointer;
      background: #d97706; color: white; border: none; border-radius: 6px; font-weight: bold; width: 100%;
    }
    #menu-panel button:hover { background: #b45309; }
    #instructions {
      position: absolute; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); color: white;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      cursor: pointer; z-index: 15;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

  <div id="crosshair"></div>

  <!-- 任務追蹤面板 -->
  <div id="mission-tracker">
    🎯 任務目標：【澳門撤離行動】<br>
    📦 收集物資箱：<span id="supply-count" style="color:#fff;">0 / 3</span><br>
    🚁 撤離點：<span id="evac-status" style="color:#ef4444;">未解鎖 (需先集齊物資)</span>
  </div>

  <div id="menu-panel">
    <h3 style="margin: 0; color: #f59e0b; font-size: 22px;">🇲🇴 澳門生存戰：大三巴突圍</h3>
    <p style="font-size: 13px; color: #cbd5e1; margin-top: 8px;">
      地標：大三巴牌坊、新葡京大樓<br>
      目標：搜刮 3 個物資箱並往大三巴直升機撤離！
    </p>
    <button id="single-btn">開始撤離任務 (Zombie Mode)</button>
  </div>

  <div id="ui">
    <div>血量 HP: <div id="hp-bar-container"><div id="hp-bar"></div></div></div>
    <div style="margin-top:8px;">喪屍擊殺: <span id="kills" style="color:#f59e0b;">0</span> | 武器: <span id="weapon-name">AK-47</span> (1 / 2 切換)</div>
  </div>

  <div id="instructions">
    <h1 style="color:#f59e0b;">🇲🇴 點擊進入澳門戰場</h1>
    <p>W, A, S, D 移動 | 滑鼠瞄準 | 左鍵開槍 | 1, 2 切換武器</p>
    <p style="color:#38bdf8; font-size:14px;">任務：尋找黃色光柱物資箱 $\rightarrow$ 走到大三巴牌坊撤離！</p>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let isSinglePlayer = false;
    let killCount = 0, playerHP = 100;
    let collectedSupplies = 0;
    const totalSupplies = 3;
    let isEvacReady = false;

    const collidableObjects = [];
    const zombies = [];
    const supplyBoxes = [];
    let evacZone = null;

    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
    let prevTime = performance.now();
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();

    const weapons = {
      rifle: { name: 'AK-47', color: 0x8B4513, length: 0.9, damage: 40 },
      pistol: { name: 'Glock 18', color: 0x222222, length: 0.4, damage: 25 }
    };
    let currentWeaponKey = 'rifle';
    let gunMesh;

    init3D();
    animate();

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0f19);
      scene.fog = new THREE.FogExp2(0x0b0f19, 0.012);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

      // 環境光與光線
      const ambientLight = new THREE.AmbientLight(0xddeeff, 0.5);
      scene.add(ambientLight);

      const moonLight = new THREE.DirectionalLight(0xfbbf24, 0.8);
      moonLight.position.set(50, 80, 30);
      scene.add(moonLight);

      // 1. 鋪設「葡國碎石路」地板 (Calçada Portuguesa)
      createPortuguesePavement();

      // 2. 建立地標：大三巴牌坊 & 新葡京
      createRuinsOfStPaul();
      createGrandLisboa();

      // 3. 建立街燈與周邊街道建築
      createStreetLights();

      // 第一人稱控制器
      controls = new THREE.PointerLockControls(camera, document.body);
      const instructions = document.getElementById('instructions');
      instructions.addEventListener('click', () => { if (controls.enabled) controls.lock(); });
      controls.addEventListener('lock', () => { instructions.style.display = 'none'; });
      controls.addEventListener('unlock', () => { instructions.style.display = 'flex'; });
      scene.add(controls.getObject());

      createGunMesh();

      document.addEventListener('keydown', onKeyDown);
      document.addEventListener('keyup', onKeyUp);
      document.addEventListener('mousedown', onShoot);
      document.getElementById('single-btn').addEventListener('click', startSinglePlayer);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.body.appendChild(renderer.domElement);
    }

    // --- 1. 葡國碎石路地板 (黑白花紋質感) ---
    function createPortuguesePavement() {
      const floorGeo = new THREE.PlaneGeometry(250, 250, 32, 32);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);
    }

    // --- 2. 🏛️ 大三巴牌坊 (Ruins of St. Paul's) ---
    function createRuinsOfStPaul() {
      const group = new THREE.Group();
      const stoneMat = new THREE.MeshStandardMaterial({ color: 0xd4d4d8, roughness: 0.7 });

      // 底層牌坊牆主體
      const base = new THREE.Mesh(new THREE.BoxGeometry(22, 6, 2.5), stoneMat);
      base.position.y = 3;
      group.add(base);

      // 拱門入口 (三個入口)
      for(let x of [-6, 0, 6]) {
        const arch = new THREE.Mesh(new THREE.BoxGeometry(3, 4, 2.6), new THREE.MeshBasicMaterial({ color: 0x000000 }));
        arch.position.set(x, 2, 0);
        group.add(arch);
      }

      // 第二層
      const layer2 = new THREE.Mesh(new THREE.BoxGeometry(18, 5, 2.2), stoneMat);
      layer2.position.y = 8.5;
      group.add(layer2);

      // 第三層
      const layer3 = new THREE.Mesh(new THREE.BoxGeometry(12, 4, 1.8), stoneMat);
      layer3.position.y = 13;
      group.add(layer3);

      // 頂層三角形與十字架
      const topTrig = new THREE.Mesh(new THREE.ConeGeometry(5, 3, 4), stoneMat);
      topTrig.position.y = 16.5;
      topTrig.rotation.y = Math.PI / 4;
      group.add(topTrig);

      const cross = new THREE.Mesh(new THREE.BoxGeometry(0.6, 2.5, 0.4), new THREE.MeshBasicMaterial({ color: 0xfbbf24 }));
      cross.position.y = 18.5;
      group.add(cross);

      // 設定大三巴位置 (北面端點)
      group.position.set(0, 0, -60);
      scene.add(group);
      collidableObjects.push(base, layer2);

      // 建立撤離點光圈 (大三巴前方)
      const evacGeo = new THREE.CylinderGeometry(4, 4, 0.2, 32);
      const evacMat = new THREE.MeshBasicMaterial({ color: 0xef4444, transparent: true, opacity: 0.5 });
      evacZone = new THREE.Mesh(evacGeo, evacMat);
      evacZone.position.set(0, 0.1, -48);
      scene.add(evacZone);
    }

    // --- 3. 🏨 新葡京 (Grand Lisboa) 摩天大樓 ---
    function createGrandLisboa() {
      const group = new THREE.Group();
      
      // 底座巨型裙樓 (鳥巢/球體結構風格)
      const baseMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.3, metalness: 0.8 });
      const base = new THREE.Mesh(new THREE.CylinderGeometry(15, 18, 12, 16), baseMat);
      base.position.y = 6;
      group.add(base);

      // 上方金色羽毛/蓮花狀摩天主樓
      const towerMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, roughness: 0.2, metalness: 0.9 });
      const tower = new THREE.Mesh(new THREE.BoxGeometry(10, 60, 6), towerMat);
      tower.position.y = 42;
      group.add(tower);

      // 頂部尖塔發光點
      const crown = new THREE.Mesh(new THREE.ConeGeometry(4, 15, 8), new THREE.MeshBasicMaterial({ color: 0xffea88 }));
      crown.position.y = 79;
      group.add(crown);

      group.position.set(70, 0, -30);
      scene.add(group);
      collidableObjects.push(base);
    }

    // --- 4. 古典街燈 (Street Lights) ---
    function createStreetLights() {
      const lightPositions = [
        {x: -15, z: -10}, {x: 15, z: -10},
        {x: -15, z: -35}, {x: 15, z: -35},
        {x: -15, z: 20},  {x: 15, z: 20}
      ];

      lightPositions.forEach(p => {
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 5), new THREE.MeshStandardMaterial({ color: 0x334155 }));
        pole.position.set(p.x, 2.5, p.z);
        scene.add(pole);

        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshBasicMaterial({ color: 0xfff5ea }));
        bulb.position.set(p.x, 5, p.z);
        scene.add(bulb);

        const light = new THREE.PointLight(0xfff5ea, 1.2, 18);
        light.position.set(p.x, 4.8, p.z);
        scene.add(light);
      });
    }

    // --- 5. 生成黃色光柱物資箱 ---
    function spawnSupplyBoxes() {
      const boxCoords = [
        {x: -25, z: -20},
        {x: 30, z: 10},
        {x: -10, z: 35}
      ];

      boxCoords.forEach((c, idx) => {
        const boxGroup = new THREE.Group();

        // 箱子主體
        const box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({ color: 0xf59e0b }));
        box.position.y = 0.6;
        boxGroup.add(box);

        // 光柱 (Light Pillar)
        const pillarGeo = new THREE.CylinderGeometry(0.8, 0.8, 20, 16);
        const pillarMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24, transparent: true, opacity: 0.3 });
        const pillar = new THREE.Mesh(pillarGeo, pillarMat);
        pillar.position.y = 10;
        boxGroup.add(pillar);

        boxGroup.position.set(c.x, 0, c.z);
        scene.add(boxGroup);

        supplyBoxes.push({ mesh: boxGroup, collected: false });
      });
    }

    function spawnZombie() {
      const zombieGroup = new THREE.Group();
      const skinMat = new THREE.MeshStandardMaterial({ color: 0x2e5a27 });
      const clothMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });

      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.1, 0.4), clothMat);
      torso.position.y = 1.1;
      zombieGroup.add(torso);

      const head = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.45, 0.45), skinMat);
      head.position.y = 1.85;
      zombieGroup.add(head);

      const armGeo = new THREE.BoxGeometry(0.2, 0.8, 0.2);
      const armL = new THREE.Mesh(armGeo, skinMat);
      armL.position.set(-0.45, 1.3, 0.35); armL.rotation.x = -Math.PI / 2.5;
      const armR = new THREE.Mesh(armGeo, skinMat);
      armR.position.set(0.45, 1.3, 0.35); armR.rotation.x = -Math.PI / 2.5;
      zombieGroup.add(armL, armR);

      const angle = Math.random() * Math.PI * 2;
      const dist = 20 + Math.random() * 25;
      zombieGroup.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);

      scene.add(zombieGroup);
      zombies.push({ mesh: zombieGroup, hp: 100, speed: 3.5, attackCooldown: 0 });
    }

    function createGunMesh() {
      if (gunMesh) camera.remove(gunMesh);
      const w = weapons[currentWeaponKey];
      gunMesh = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.1, w.length), new THREE.MeshStandardMaterial({ color: w.color }));
      gunMesh.position.set(0.2, -0.2, -0.4);
      camera.add(gunMesh);
      document.getElementById('weapon-name').innerText = w.name;
    }

    function startSinglePlayer() {
      isSinglePlayer = true;
      collectedSupplies = 0;
      isEvacReady = false;
      document.getElementById('supply-count').innerText = `0 / ${totalSupplies}`;
      document.getElementById('evac-status').innerText = '未解鎖 (需先集齊物資)';
      document.getElementById('evac-status').style.color = '#ef4444';

      // 生成 3 個物資箱與 6 只喪屍
      spawnSupplyBoxes();
      zombies.forEach(z => scene.remove(z.mesh));
      zombies.length = 0;
      for(let i = 0; i < 6; i++) spawnZombie();

      controls.lock();
    }

    function onShoot(e) {
      if (!controls.isLocked || e.button !== 0) return;

      gunMesh.position.z += 0.06;
      setTimeout(() => gunMesh.position.z -= 0.06, 50);

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

      for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        const intersects = raycaster.intersectObjects(z.mesh.children);

        if (intersects.length > 0) {
          z.hp -= weapons[currentWeaponKey].damage;
          const dir = new THREE.Vector3().subVectors(z.mesh.position, controls.getObject().position).normalize();
          z.mesh.position.addScaledVector(dir, 0.8);

          if (z.hp <= 0) {
            scene.remove(z.mesh);
            zombies.splice(i, 1);
            killCount++;
            document.getElementById('kills').innerText = killCount;
            setTimeout(spawnZombie, 1200);
          }
          break;
        }
      }
    }

    function checkWallCollision(newPosition) {
      const playerPos = newPosition.clone();
      playerPos.y = 1.0;
      const directions = [new THREE.Vector3(1,0,0), new THREE.Vector3(-1,0,0), new THREE.Vector3(0,0,1), new THREE.Vector3(0,0,-1)];

      for (let dir of directions) {
        const raycaster = new THREE.Raycaster(playerPos, dir, 0, 0.8);
        if (raycaster.intersectObjects(collidableObjects).length > 0) return true;
      }
      return false;
    }

    function animate() {
      requestAnimationFrame(animate);

      if (controls.isLocked) {
        const time = performance.now();
        const delta = (time - prevTime) / 1000;

        velocity.x -= velocity.x * 10.0 * delta;
        velocity.z -= velocity.z * 10.0 * delta;

        direction.z = Number(moveForward) - Number(moveBackward);
        direction.x = Number(moveRight) - Number(moveLeft);
        direction.normalize();

        if (moveForward || moveBackward) velocity.z -= direction.z * 50.0 * delta;
        if (moveLeft || moveRight) velocity.x -= direction.x * 50.0 * delta;

        const currentPos = controls.getObject().position.clone();
        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);

        if (checkWallCollision(controls.getObject().position)) {
          controls.getObject().position.copy(currentPos);
        }

        const playerPos = controls.getObject().position;

        // --- 撿取物資箱判定 ---
        supplyBoxes.forEach(sb => {
          if (!sb.collected && playerPos.distanceTo(sb.mesh.position) < 2.0) {
            sb.collected = true;
            scene.remove(sb.mesh);
            collectedSupplies++;
            document.getElementById('supply-count').innerText = `${collectedSupplies} / ${totalSupplies}`;

            if (collectedSupplies >= totalSupplies) {
              isEvacReady = true;
              document.getElementById('evac-status').innerText = '🟢 已解鎖！前往大三巴撤離！';
              document.getElementById('evac-status').style.color = '#10b981';
              evacZone.material.color.setHex(0x10b981); // 撤離區變綠色
            }
          }
        });

        // --- 撤離區判定 (進入大三巴光圈) ---
        if (isEvacReady && playerPos.distanceTo(evacZone.position) < 4.0) {
          alert('🚁 任務成功！直升機已載你安全撤離澳門！');
          controls.unlock();
          location.reload();
        }

        // --- 喪屍 AI 與攻擊 ---
        zombies.forEach(z => {
          const zPos = z.mesh.position;
          const dist = zPos.distanceTo(playerPos);

          if (dist > 1.2) {
            const dir = new THREE.Vector3().subVectors(playerPos, zPos);
            dir.y = 0; dir.normalize();
            zPos.addScaledVector(dir, z.speed * delta);
            z.mesh.lookAt(playerPos.x, 0, playerPos.z);
          } else {
            if (time - z.attackCooldown > 1000) {
              playerHP -= 15;
              document.getElementById('hp-bar').style.width = Math.max(0, playerHP) + '%';
              z.attackCooldown = time;

              if (playerHP <= 0) {
                alert('🧟‍♂️ 撤離失敗！你被喪屍圍攻倒下了！');
                controls.unlock();
                location.reload();
              }
            }
          }
        });

        prevTime = time;
      }

      renderer.render(scene, camera);
    }

    function onKeyDown(e) {
      switch (e.code) {
        case 'KeyW': moveForward = true; break;
        case 'KeyS': moveBackward = true; break;
        case 'KeyA': moveLeft = true; break;
        case 'KeyD': moveRight = true; break;
        case 'Digit1': switchWeapon('rifle'); break;
        case 'Digit2': switchWeapon('pistol'); break;
      }
    }

    function onKeyUp(e) {
      switch (e.code) {
        case 'KeyW': moveForward = false; break;
        case 'KeyS': moveBackward = false; break;
        case 'KeyA': moveLeft = false; break;
        case 'KeyD': moveRight = false; break;
      }
    }

    function switchWeapon(type) {
      if (weapons[type] && currentWeaponKey !== type) {
        currentWeaponKey = type;
        createGunMesh();
      }
    }
  </script>
</body>
</html>
